name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print runtime diagnostics
        run: |
          git rev-parse HEAD
          git status --short --branch
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run archive regression suite
        run: python -m unittest tests.test_archives

      # Ledger coherence. Split into ENFORCED and REPORTED deliberately, because
      # a check that is red on arrival is a check people learn to ignore, and
      # then it is worth less than nothing -- it looks like coverage.
      #
      # ENFORCED covers the two ledgers that are coherent TODAY, so they cannot
      # silently regress. Both were repaired on 2026-08-18 after `#447` was found
      # in neither todo.md nor its archive, and after lanes.md was found with 7
      # slugs carrying two OPEN blocks each -- two sessions could each read
      # themselves as holding the same files.
      #
      # --no-history: the default todo pass runs `git log -p` over 700+ commits
      # to recover ids that only ever existed as legacy table rows. That is an
      # audit, not a CI gate, and CI checks out a shallow clone anyway.
      # state.md joined the enforced set once its two stacked subjects were
      # collapsed (sim-scheduling-deploy-lineage x2, wnba-sweep-ownership-gate
      # x3). It was `continue-on-error` for exactly as long as it was red, and
      # no longer -- a permanently-tolerated failure is how a gate becomes
      # decoration.
      - name: Ledger coherence (enforced -- lanes.md, todo.md, state.md)
        run: |
          python scripts/lane_identity_check.py
          python scripts/todo_id_reconcile.py --no-history
          python scripts/state_key_check.py
