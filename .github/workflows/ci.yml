name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print runtime diagnostics
        run: |
          git rev-parse HEAD
          git status --short --branch
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run archive regression suite
        run: python -m unittest tests.test_archives

      # Ledger coherence. Split into ENFORCED and REPORTED deliberately, because
      # a check that is red on arrival is a check people learn to ignore, and
      # then it is worth less than nothing -- it looks like coverage.
      #
      # ENFORCED covers the two ledgers that are coherent TODAY, so they cannot
      # silently regress. Both were repaired on 2026-08-18 after `#447` was found
      # in neither todo.md nor its archive, and after lanes.md was found with 7
      # slugs carrying two OPEN blocks each -- two sessions could each read
      # themselves as holding the same files.
      #
      # --no-history: the default todo pass runs `git log -p` over 700+ commits
      # to recover ids that only ever existed as legacy table rows. That is an
      # audit, not a CI gate, and CI checks out a shallow clone anyway.
      # state.md joined the enforced set once its two stacked subjects were
      # collapsed (sim-scheduling-deploy-lineage x2, wnba-sweep-ownership-gate
      # x3). It was `continue-on-error` for exactly as long as it was red, and
      # no longer -- a permanently-tolerated failure is how a gate becomes
      # decoration.
      - name: Ledger coherence (enforced -- lanes.md, todo.md, state.md)
        run: |
          python scripts/lane_identity_check.py
          python scripts/todo_id_reconcile.py --no-history
          python scripts/state_key_check.py

      # The hooks that enforce all of the above. ENFORCED from the first run:
      # all four suites are green (59 cases) and none is vacuous -- each was
      # mutation-tested by disabling the predicate under test, and each went red.
      # A suite that stays green with its subject disabled is measuring nothing,
      # which is the same "looks like coverage" failure the split above exists
      # to avoid.
      #
      # WHY THESE EXIST. Four guards resolved paths against CLAUDE_PROJECT_DIR
      # -- the PRIMARY checkout -- while every session works in its own linked
      # worktree (scripts/session_worktree.py). Measured 2026-08-20:
      #   ledger-commit-guard   blocked a CLEAN worktree over the primary tree's
      #                         duplicate lane blocks, and printed a cleanup that
      #                         would have rewritten two OTHER lanes' blocks.
      #   ledger-append-guard   fully INERT in every worktree. Identical
      #                         violating edit: primary exit=2, worktree exit=0.
      #   ledger-postwrite      blind to worktree Bash writes -- the one thing it
      #                         exists to catch -- and blamed unrelated sessions
      #                         for changes it merely observed.
      # An inert guard and a satisfied guard are indistinguishable from outside,
      # so these need a suite, not an eyeball. lane-guard is EXONERATED and its
      # pre-existing suite is included to keep it that way.
      #
      # The suites build throwaway git repos under the OS temp dir. They never
      # read the live ledger: the first version of the commit-guard suite did,
      # and a parallel session trimming real duplicates mid-run flipped three
      # cases from pass to fail.
      - name: Hook guards (enforced -- worktree resolution, overrides, fail-open)
        run: |
          python .claude/hooks/test_ledger_commit_guard.py
          python .claude/hooks/test_ledger_append_guard.py
          python .claude/hooks/test_ledger_postwrite_check.py
          python .claude/hooks/test_ledger_deploys_invariant.py
          python .claude/hooks/test_lane_guard_hyphen.py

  # `#517`. THE FULL PYTEST SUITE, GATED ON NO NEW FAILURES -- not on green.
  #
  # Measured 2026-08-22 on clean `origin/main`: `76 failed, 9245 passed` across
  # 26 files, every sampled one reproducing standalone. The `test` job above
  # runs `tests.test_archives` (383 cases) and nothing else, so those 76 sit
  # there indefinitely while CI shows green -- which is exactly how `#516`'s six
  # stale test targets survived, one of them a test passing VACUOUSLY.
  #
  # A plain green gate lands red on the first run, and this file already argues
  # why that is worse than nothing ("a check that is red on arrival is a check
  # people learn to ignore ... it looks like coverage"). `continue-on-error`
  # would be that decoration in one line. So the DERIVATIVE is gated instead:
  # the known-failing set is recorded in `tests/pytest_baseline.json`, and this
  # fails when the set GROWS. Regressions are caught from today; the debt stays
  # visible as a number in a tracked file rather than a red check nobody reads.
  #
  # It also fails when a baselined test starts PASSING, with the remedy printed.
  # That is deliberate: a baseline that never shrinks stops describing reality,
  # and "no new failures" quietly becomes "no information".
  #
  # SEPARATE JOB, not a step, so the ~27-minute suite never delays the fast
  # feedback from `test`. Both must pass for the workflow to.
  #
  # THE INSTALL IS DELIBERATELY NARROW: `requirements.txt` plus pytest, and NOT
  # `requirements-dev.txt`. That file carries psutil, whose PRESENCE CHANGES
  # BEHAVIOUR -- `memory_observability` picks a psutil backend over its procfs
  # one, and two of the baselined failures are memory tests. The baseline was
  # generated on Python 3.11 with psutil and playwright ABSENT; an install that
  # does not match it reports phantom regressions on the first run. The pytest
  # pin is read out of requirements-dev.txt rather than repeated here, so there
  # is one source for it.
  pytest-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "$(grep -E '^pytest>' requirements-dev.txt)"
          pip install "$(grep -E '^pytest-xdist' requirements-dev.txt)"

      # `.syndicate/scope_2026-08-25_ci_pytest_parallelization.md`. Measured
      # 3.7x (45min -> 12min) on this same 4-core runner, `--dist=loadscope`
      # rather than the default `--dist=load` so one test FILE's cases stay
      # in one worker instead of interleaving with another file's -- safer
      # against this suite's existing module-level-state test-order
      # sensitivity, not a fix for it (see that document's own investigation:
      # every failure newly surfaced by `-n auto` in that pass turned out to
      # reproduce standalone too, unrelated to parallelization).
      - name: Full pytest suite (enforced -- no NEW failures vs the baseline)
        run: python scripts/pytest_baseline.py --runnable -- tests/ -n auto --dist=loadscope
