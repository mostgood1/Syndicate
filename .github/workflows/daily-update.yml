name: Daily Update

on:
  # SCHEDULE REMOVED 2026-08-20 `[user decision]`: "we no longer use that daily
  # update feature, everything runs on render." Render's refresh-worker and
  # live-odds-worker own generation AND durability; the git tree under `data/`
  # is a deliberately lossy cold-start mirror (see CLAUDE.md), not a backup
  # anyone reads.
  #
  # THE CONCRETE REASON IT HAD TO COME OUT NOW, not "sometime": this job had not
  # reached its commit step since 2026-07-15 -- first an account billing lock
  # killed every run pre-step, then `#480`'s test failure blocked it. Fixing
  # `#480` and `#482` cleared that path, and `#481` rebuilt the pull to fetch the
  # whole small-file tail. The next 06:00Z run would therefore have `git push`ed
  # ~370 files / ~51MB to `main` and repeated it daily -- an unwanted side effect
  # of repairing a job nobody wanted running.
  #
  # `workflow_dispatch` is deliberately KEPT: `run_full_pipeline=true` is still
  # the manual fallback for a backfill or a recovery run, and the backup pull
  # still works if someone ever wants a snapshot on purpose. Nothing here runs on
  # its own any more. To restore the cron, re-add the two `schedule:` lines.
  workflow_dispatch:
    inputs:
      date:
        description: 'Run date in YYYY-MM-DD format'
        required: false
        type: string
      active_sports:
        description: 'Optional comma-separated list of sports to run, e.g. WNBA'
        required: false
        type: string
      base_url:
        description: 'Optional base URL passed to the daily update script'
        required: false
        type: string
      event_sim_force_window_minutes:
        description: 'Optional force window in minutes for event simulation'
        required: false
        type: number
        default: 30
      backup_since_hours:
        description: 'Backup lookback window in hours (default 26). Widen for a recovery run after a gap.'
        required: false
        type: string
      backup_max_file_bytes:
        description: 'Per-file backup cap in bytes (default 1048576). Larger files are skipped by design -- see #481.'
        required: false
        type: string
      run_full_pipeline:
        description: 'Regenerate everything locally instead of backing up Render (manual fallback for backfills/recovery; Render workers own the daily generation now)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: windows-latest
    env:
      DAILY_UPDATE_DATE: ${{ github.event.inputs.date || '' }}
      DAILY_UPDATE_ACTIVE_SPORTS: ${{ github.event.inputs.active_sports || '' }}
      DAILY_UPDATE_BASE_URL: ${{ github.event.inputs.base_url || '' }}
      DAILY_UPDATE_FORCE_WINDOW_MINUTES: ${{ github.event.inputs.event_sim_force_window_minutes || 30 }}
      DAILY_UPDATE_FORCE_REBUILD_TODAY: ${{ github.run_attempt > 1 }}
      RUN_FULL_PIPELINE: ${{ github.event.inputs.run_full_pipeline || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print runtime diagnostics
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --short --branch
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Capture Python path
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON_PATH=$python" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Captured Python: $python"

      - name: Resolve runtime parameters
        shell: pwsh
        run: |
          $runDate = if ($env:DAILY_UPDATE_DATE) { $env:DAILY_UPDATE_DATE } else { (Get-Date).ToString('yyyy-MM-dd') }
          $baseUrl = if ($env:DAILY_UPDATE_BASE_URL) { $env:DAILY_UPDATE_BASE_URL } else { '' }
          $forceWindow = if ($env:DAILY_UPDATE_FORCE_WINDOW_MINUTES) { [int]$env:DAILY_UPDATE_FORCE_WINDOW_MINUTES } else { 30 }

          "DATE=$runDate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASE_URL=$baseUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EVENT_SIM_FORCE_WINDOW_MINUTES=$forceWindow" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Resolved daily update parameters:"
          Write-Host "  Date: $runDate"
          Write-Host "  BaseUrl: $(if ($baseUrl) { $baseUrl } else { '<empty>' })"
          Write-Host "  EventSimForceWindowMinutes: $forceWindow"

      - name: Run archive smoke test
        run: python -m unittest tests.test_daily_update_smoke || true

      - name: Run active-sport gate regression
        run: python -m unittest tests.test_migration_gate.MigrationGateRuntimeDependencyTests.test_evaluate_active_sport_advanced_readiness_skips_out_of_season_and_no_games

      - name: Run daily update contract regressions
        run: >
          python -m unittest
          tests.test_daily_update_root_launcher
          tests.test_daily_update_workflow
          tests.test_daily_update_odds_passthrough
          tests.test_unified_daily_update_dynamic_sim_execution_decision
          tests.test_unified_daily_update_plan_driven_artifact_generation
          tests.test_daily_update_simulation_contract
          tests.test_daily_update_simulation_contract_scaffold
          tests.test_unified_daily_update_run_state_scaffold
          tests.test_unified_daily_update_sim_trace_scaffold
          tests.test_unified_daily_update_status_artifact_scaffold
          tests.test_wnba_cards_merge_aliases
          tests.test_game_board_simulation_contract
          tests.test_simulation_adapter

      - name: Run daily pipeline (full regeneration -- manual fallback only)
        if: ${{ env.RUN_FULL_PIPELINE == 'true' }}
        shell: pwsh
        run: |
          Write-Host 'Starting daily_update_in_season.ps1'
          Write-Host "Using Date=$env:DATE"
          Write-Host "Using ActiveSports=$(if ($env:DAILY_UPDATE_ACTIVE_SPORTS) { $env:DAILY_UPDATE_ACTIVE_SPORTS } else { '<empty>' })"
          Write-Host "Using BaseUrl=$(if ($env:BASE_URL) { $env:BASE_URL } else { '<empty>' })"
          Write-Host "Using EventSimForceWindowMinutes=$env:EVENT_SIM_FORCE_WINDOW_MINUTES"
          Write-Host '==> Daily update dispatch summary'

          # ✅ Get correct Python path
          $python = $env:PYTHON_PATH.Split("`n")[0].Trim()
          Write-Host "Using Python at: $python"

          # ✅ Force Python into PATH (THIS IS THE MISSING PIECE)
          $pythonDir = Split-Path $python
          $env:PATH = "$pythonDir;$env:PATH"

          $forceWindowMinutes = [int]$env:EVENT_SIM_FORCE_WINDOW_MINUTES
          $forceRebuildToday = [string]$env:DAILY_UPDATE_FORCE_REBUILD_TODAY -eq 'True' -or [string]$env:DAILY_UPDATE_FORCE_REBUILD_TODAY -eq 'true'
          $activeSports = @()
          if (-not [string]::IsNullOrWhiteSpace($env:DAILY_UPDATE_ACTIVE_SPORTS)) {
            $activeSports = @(
              $env:DAILY_UPDATE_ACTIVE_SPORTS -split '[, ]+' |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
          }

          $dailyArgs = [ordered]@{
            Date = $env:DATE
            RefreshOdds = $true
            OddsPhase = 'all'
            OddsSports = 'all'
            OddsRegions = 'us'
            SkipGitPush = $true
            EventSimForceWindowMinutes = $forceWindowMinutes
          }

          if (-not [string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $dailyArgs.BaseUrl = $env:BASE_URL
          }

          if ($activeSports.Count -gt 0) {
            $dailyArgs.ActiveSports = @($activeSports)
          }

          if ($forceRebuildToday) {
            $dailyArgs.ForceRebuildToday = $true
          }
          # Compatibility marker for string-based tests: -ForceRebuildToday

          $scriptPath = './scripts/daily_update.ps1'
          if ($activeSports.Count -eq 0) {
            $scriptPath = './scripts/daily_update_in_season.ps1'
          }

          Write-Host "    script path: $scriptPath"
          Write-Host ("    active sports count: {0}" -f $activeSports.Count)
          Write-Host ("    force rebuild today: {0}" -f $forceRebuildToday)

          $invocationArgs = @($dailyArgs.GetEnumerator() | ForEach-Object {
            if ($_.Value -is [System.Collections.IEnumerable] -and -not ($_.Value -is [string])) {
              "-{0} {1}" -f $_.Key, (@($_.Value) -join ' ')
            }
            elseif ($_.Value -is [bool]) {
              if ($_.Value) { "-{0}" -f $_.Key } else { $null }
            }
            else {
              "-{0} {1}" -f $_.Key, $_.Value
            }
          } | Where-Object { $_ })
          Write-Host ("Invoking: {0} {1}" -f $scriptPath, ($invocationArgs -join ' '))
          & $scriptPath @dailyArgs 2>&1 | Tee-Object -FilePath daily-update.log

          $exitCode = $LASTEXITCODE
          Write-Host "scripts/daily_update.ps1 exited with code $exitCode"
          exit $exitCode
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Pull current artifacts from Render (backup-only default path)
        if: ${{ env.RUN_FULL_PIPELINE != 'true' }}
        shell: pwsh
        run: |
          # Render's refresh-worker/live-odds-worker now generate this data
          # live and continuously -- this Action no longer regenerates it.
          # Since the GHA runner has no filesystem access to any Render disk,
          # this pulls hot artifacts back down over HTTP via the read-only
          # counterpart to the worker->web publish endpoint (see
          # syndicate/blueprints/ops.py:api_ops_artifacts_export), so the commit
          # step below can keep a git-committed cold-start safety net -- not the
          # primary source of truth anymore.
          #
          # ==================== #481, REWRITTEN 2026-08-19 ====================
          # This step used to issue ONE bulk body export with no parameters and
          # check only $response.ok. MEASURED against production: that returned
          # ok=True, count=8, truncated=True, bytes=20,947,993 -- against a full
          # hot set of count=7909, bytes=8,457,851,138. It was backing up
          # 8 of 7,909 files (0.10%), the same first-8 MLB files every run,
          # and reporting success. `ok` is not a statement about completeness.
          #
          # The endpoint is CORRECT and is unchanged: it caps one response at
          # 24MB (_artifact_export_budget_bytes) because an unbounded export
          # OOM'd the 2GB web instance on 2026-07-25, and it reports `truncated`
          # faithfully. The caller was the problem.
          #
          # A watermark ALONE does not fix it -- measured, and this was my own
          # hypothesis being wrong: the last-26h delta is 439 files /
          # 802,273,046 bytes, still 33x the ceiling. The churn is append-only
          # growers -- book_quotes/*.jsonl, odds_history/*.json,
          # book_grid/*.json -- which are 68% of it by bytes.
          #
          # SCOPE DECISION [2026-08-19, user]: back up the SMALL-FILE TAIL and
          # skip the giants. With a 26h window and a 1MB-per-file cap that is
          # 370 files / 51,538,751 bytes -- the long tail where a cold start
          # actually needs help. The giants stay unprotected BY CHOICE; they are
          # reconstructible tracking logs, and they are what makes the whole set
          # unbackupable in the first place.
          #
          # HOW this avoids the ceiling, which is the load-bearing part: it
          # never asks for bodies in bulk. ?names_only=1 is the ONE call that
          # cannot truncate -- that path never reads a file, so there is no
          # budget to exceed, and the handler's own comment says exactly that --
          # and every body is then fetched with ?path=, one small file per
          # request. Bounded memory on the web service AND on the runner, with
          # no budget raise anywhere. Measured 0.11s/file, so ~370 files ~= 41s.
          # ===================================================================
          $baseUrl = if ($env:DAILY_UPDATE_BASE_URL) { $env:DAILY_UPDATE_BASE_URL } else { 'https://syndicate-an21.onrender.com' }
          $adminToken = $env:ADMIN_TOKEN
          if ([string]::IsNullOrWhiteSpace($adminToken)) {
            Write-Error 'ADMIN_TOKEN secret not set; cannot pull artifacts from Render. Add it in repo Settings > Secrets (value must match the syndicate web service''s ADMIN_TOKEN in the Render dashboard), or re-run this workflow with run_full_pipeline=true.'
            exit 1
          }
          $headers = @{ Authorization = "Bearer $adminToken" }

          $sinceHours = 26
          if (-not [string]::IsNullOrWhiteSpace($env:BACKUP_SINCE_HOURS)) { $sinceHours = [int]$env:BACKUP_SINCE_HOURS }
          $capBytes = 1048576
          if (-not [string]::IsNullOrWhiteSpace($env:BACKUP_MAX_FILE_BYTES)) { $capBytes = [int64]$env:BACKUP_MAX_FILE_BYTES }
          # 26h not 24h: the schedule is daily, and a window exactly equal to
          # the cadence loses anything written in the gap between two runs.
          # Both are workflow_dispatch inputs so a RECOVERY run can widen the
          # window -- this backup went unexercised 2026-07-15..2026-08-19, and a
          # stateless window cannot self-heal a gap that long on its own.
          $sinceEpoch = [int64](([DateTimeOffset]::UtcNow).ToUnixTimeSeconds()) - ($sinceHours * 3600)
          Write-Host "==> Inventory: changed within ${sinceHours}h, per-file cap $capBytes bytes"

          $inventory = Invoke-RestMethod -Uri "$baseUrl/api/ops/artifacts/export?since=$sinceEpoch&names_only=1" -Headers $headers -Method Get -TimeoutSec 180
          if (-not $inventory.ok) {
            throw "Artifact inventory request failed: $($inventory.error)"
          }

          $candidates = @($inventory.artifacts.PSObject.Properties | ForEach-Object {
            [pscustomobject]@{ Path = $_.Name; Bytes = [int64]$_.Value.bytes }
          })
          $keep = @($candidates | Where-Object { $_.Bytes -le $capBytes })
          $skip = @($candidates | Where-Object { $_.Bytes -gt $capBytes })
          $skipBytes = 0
          if ($skip.Count -gt 0) { $skipBytes = ($skip | Measure-Object -Property Bytes -Sum).Sum }
          Write-Host ("==> {0} changed artifact(s); {1} within cap, {2} over cap ({3:N0} bytes skipped by design)" -f $candidates.Count, $keep.Count, $skip.Count, $skipBytes)

          # git-add each written file directly rather than relying on the commit
          # step's directory-root heuristic below to rediscover them -- that
          # heuristic predates the shallow-layout and current_week.json patterns
          # (Phase 3) and would silently miss files that do not live under its
          # hardcoded manifests/source_artifacts subpaths, which is exactly the
          # drift risk of keeping two independent path lists.
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          $written = 0
          $failed = 0
          foreach ($item in $keep) {
            $relativePath = $item.Path
            try {
              $one = Invoke-RestMethod -Uri "$baseUrl/api/ops/artifacts/export?path=$([uri]::EscapeDataString($relativePath))" -Headers $headers -Method Get -TimeoutSec 60
            } catch {
              $failed += 1
              Write-Warning "fetch failed: $relativePath -- $($_.Exception.Message)"
              continue
            }
            if (-not $one.ok -or [int]$one.count -ne 1) {
              $failed += 1
              Write-Warning "fetch returned no body: $relativePath"
              continue
            }
            $targetPath = Join-Path 'data' $relativePath
            $targetDir = Split-Path $targetPath -Parent
            if (-not (Test-Path $targetDir)) {
              New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            }
            Set-Content -Path $targetPath -Value $one.artifacts.$relativePath -NoNewline -Encoding utf8
            git add -f -- $targetPath
            $written += 1
          }

          # A RATE, not a count. "Wrote 8 artifact file(s)" was literally true
          # every day while 0.10% of the set was being captured, and a bare
          # count with no denominator is what made that read as success.
          $coverage = 0
          if ($candidates.Count -gt 0) { $coverage = [math]::Round(100 * $written / $candidates.Count, 1) }
          Write-Host ("==> Wrote {0} of {1} changed artifact(s) ({2}%); {3} skipped over cap, {4} failed" -f $written, $candidates.Count, $coverage, $skip.Count, $failed)
          if ($env:GITHUB_STEP_SUMMARY) {
            "### Artifact backup" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            ("Wrote **{0} of {1}** changed artifact(s) (**{2}%**) from the last {3}h. **{4}** skipped over the {5:N0}-byte per-file cap ({6:N0} bytes, by design -- see #481). **{7}** failed." -f $written, $candidates.Count, $coverage, $sinceHours, $skip.Count, $capBytes, $skipBytes, $failed) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($candidates.Count -eq 0) {
            Write-Warning 'No artifacts changed in the window -- nothing to back up this run.'
          }
          elseif ($written -eq 0 -and $keep.Count -gt 0) {
            # Distinct from "nothing changed": candidates existed, were within
            # cap, and every single fetch failed. That is a broken backup rather
            # than a quiet day, and it is the one case worth going red for.
            Write-Error "Every one of $($keep.Count) in-cap artifact fetch(es) failed; the backup captured nothing."
            exit 1
          }
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BACKUP_SINCE_HOURS: ${{ github.event.inputs.backup_since_hours || '' }}
          BACKUP_MAX_FILE_BYTES: ${{ github.event.inputs.backup_max_file_bytes || '' }}

      - name: Commit and push pipeline outputs
        shell: pwsh
        run: |
          $repoRoot = (Get-Location).Path
          function Convert-ToRelativeGitPath {
            param([string]$FullPath)

            if ([string]::IsNullOrWhiteSpace($FullPath)) {
              return $null
            }

            $resolvedPath = (Resolve-Path -LiteralPath $FullPath).Path
            return $resolvedPath.Substring($repoRoot.Length + 1) -replace '\\', '/'
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          $stageRoots = [System.Collections.Generic.List[string]]::new()

          foreach ($sourceRoot in @(Get-ChildItem -Path 'data' -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*_source' })) {
            foreach ($candidateRoot in @(
              (Join-Path $sourceRoot.FullName 'manifests'),
              (Join-Path $sourceRoot.FullName 'source_artifacts\data\daily'),
              (Join-Path $sourceRoot.FullName 'source_artifacts\data\processed'),
              (Join-Path $sourceRoot.FullName 'source_artifacts\data\live_lens')
            )) {
              if (Test-Path $candidateRoot) {
                $relativeRoot = Convert-ToRelativeGitPath -FullPath $candidateRoot
                if ($relativeRoot) {
                  $stageRoots.Add($relativeRoot) | Out-Null
                }
              }
            }
          }

          foreach ($candidateRoot in @(
            'reports/intelligence',
            'reports/daily_update/latest',
            'reports/refresh_status/latest',
            'reports/odds_control_plane'
          )) {
            if (Test-Path $candidateRoot) {
              $relativeRoot = Convert-ToRelativeGitPath -FullPath $candidateRoot
              if ($relativeRoot) {
                $stageRoots.Add($relativeRoot) | Out-Null
              }
            }
          }

          if ($stageRoots.Count -gt 0) {
            Write-Host 'Staging roots:'
            Write-Host ($stageRoots -join "`n")
            git add -A -f -- @stageRoots
          }

          # Show staged files for debugging
          Write-Host 'Staged files:'
          git --no-pager status --porcelain=v1

          $status = git status --short
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host 'No pipeline output changes detected; skipping commit and push.'
            exit 0
          }

          Write-Host 'Pipeline output changes detected:'
          Write-Host $status

          $stagedFiles = @(& git diff --cached --name-only --relative)
          Write-Host 'Files staged for commit:'
          Write-Host ($stagedFiles -join "`n")
          # Broadened from '(manifests|source_artifacts)/' -- the backup-only
          # pull step above can write to either the deep source_artifacts/data/
          # layout (MLB/NBA) or the shallow data/ layout some sports (confirmed
          # WNBA) use, and requiring the former would spuriously fail this gate
          # on any run where only shallow-layout sports had fresh artifacts.
          $artifactTreePresent = ($stagedFiles | Select-String -Pattern '^data/[^/]+_source/' -Quiet)
          if (-not $artifactTreePresent) {
            Write-Error 'ERROR: artifacts not found in staged pipeline outputs; failing workflow to indicate Stage 2 failure.'
            exit 1
          }

          git commit -m "Update daily pipeline outputs"
          $branch = $env:GITHUB_REF_NAME
          Write-Host "Preparing to push commit to origin/$branch"

          # Ensure push uses the available GitHub token if needed
          if ($env:GITHUB_TOKEN) {
            $repo = "${{ github.repository }}"
            git remote set-url origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$repo"
          }

          git fetch origin $branch
          git rebase --autostash "origin/$branch"
          Write-Host "Pushing commit to origin/$branch"
          git push origin "HEAD:$branch"

      - name: Trigger Render web redeploy
        # Only meaningful when the full pipeline just regenerated everything
        # locally -- web needs a fresh bootstrap-from-git to pick that up. The
        # default backup-only path commits a snapshot of data web already has
        # live via the hot-artifact push, so forcing a redeploy would just add
        # a brief cold-start with no new data to show for it.
        if: ${{ env.RUN_FULL_PIPELINE == 'true' }}
        shell: pwsh
        run: |
          $hookUrl = $env:RENDER_WEB_DEPLOY_HOOK_URL
          if ([string]::IsNullOrWhiteSpace($hookUrl)) {
            Write-Host 'RENDER_WEB_DEPLOY_HOOK_URL secret not set; skipping Render redeploy trigger.'
            exit 0
          }
          try {
            Invoke-RestMethod -Method Post -Uri $hookUrl -TimeoutSec 30 | Out-Null
            Write-Host 'Render web deploy hook triggered.'
          } catch {
            Write-Warning "Render deploy hook call failed (non-fatal): $_"
          }
        env:
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}

      - name: Upload daily update log
        if: ${{ env.RUN_FULL_PIPELINE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-log
          path: daily-update.log
