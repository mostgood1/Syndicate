name: Daily Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Run date in YYYY-MM-DD format'
        required: false
        type: string
      base_url:
        description: 'Optional base URL passed to the daily update script'
        required: false
        type: string
      event_sim_force_window_minutes:
        description: 'Optional force window in minutes for event simulation'
        required: false
        type: number
        default: 30

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: windows-latest
    env:
      DAILY_UPDATE_DATE: ${{ github.event.inputs.date || '' }}
      DAILY_UPDATE_BASE_URL: ${{ github.event.inputs.base_url || '' }}
      DAILY_UPDATE_FORCE_WINDOW_MINUTES: ${{ github.event.inputs.event_sim_force_window_minutes || 30 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print runtime diagnostics
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --short --branch
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Capture Python path
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON_PATH=$python" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Captured Python: $python"

      - name: Resolve runtime parameters
        shell: pwsh
        run: |
          $runDate = if ($env:DAILY_UPDATE_DATE) { $env:DAILY_UPDATE_DATE } else { (Get-Date).ToString('yyyy-MM-dd') }
          $baseUrl = if ($env:DAILY_UPDATE_BASE_URL) { $env:DAILY_UPDATE_BASE_URL } else { '' }
          $forceWindow = if ($env:DAILY_UPDATE_FORCE_WINDOW_MINUTES) { [int]$env:DAILY_UPDATE_FORCE_WINDOW_MINUTES } else { 30 }

          "DATE=$runDate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASE_URL=$baseUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EVENT_SIM_FORCE_WINDOW_MINUTES=$forceWindow" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Resolved daily update parameters:"
          Write-Host "  Date: $runDate"
          Write-Host "  BaseUrl: $(if ($baseUrl) { $baseUrl } else { '<empty>' })"
          Write-Host "  EventSimForceWindowMinutes: $forceWindow"

      - name: Run archive regression suite
        run: python -m unittest tests.test_archives || true

      - name: Run active-sport gate regression
        run: python -m unittest tests.test_migration_gate.MigrationGateRuntimeDependencyTests.test_evaluate_active_sport_advanced_readiness_skips_out_of_season_and_no_games

      - name: Run daily pipeline
        shell: pwsh
        run: |
          Write-Host 'Starting daily_update_in_season.ps1'
          Write-Host "Using Date=$env:DATE"
          Write-Host "Using BaseUrl=$(if ($env:BASE_URL) { $env:BASE_URL } else { '<empty>' })"
          Write-Host "Using EventSimForceWindowMinutes=$env:EVENT_SIM_FORCE_WINDOW_MINUTES"

          # ✅ Get correct Python path
          $python = $env:PYTHON_PATH.Split("`n")[0].Trim()
          Write-Host "Using Python at: $python"

          # ✅ Force Python into PATH (THIS IS THE MISSING PIECE)
          $pythonDir = Split-Path $python
          $env:PATH = "$pythonDir;$env:PATH"

          $forceWindowMinutes = [int]$env:EVENT_SIM_FORCE_WINDOW_MINUTES

          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            & ./daily_update_in_season.ps1 `
              -Date $env:DATE `
              -RefreshOdds `
              -OddsPhase all `
              -OddsSports all `
              -OddsRegions us `
              -SkipGitPush `
              -EventSimForceWindowMinutes $forceWindowMinutes 2>&1 | Tee-Object -FilePath daily-update.log
          }
          else {
            & ./daily_update_in_season.ps1 `
              -Date $env:DATE `
              -BaseUrl $env:BASE_URL `
              -RefreshOdds `
              -OddsPhase all `
              -OddsSports all `
              -OddsRegions us `
              -SkipGitPush `
              -EventSimForceWindowMinutes $forceWindowMinutes 2>&1 | Tee-Object -FilePath daily-update.log
          }

          $exitCode = $LASTEXITCODE
          Write-Host "scripts/daily_update.ps1 exited with code $exitCode"
          exit $exitCode
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push pipeline outputs
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Explicitly stage artifact trees and manifests so they are committed even if ignored.
          # Stage all sport source_artifacts (data/*_source/source_artifacts), manifests, and known report roots.
          git add -f -- data/*_source/source_artifacts || true
          git add -f -- data/*_source/manifests || true
          git add -f -- data/*_source/manifests/* || true
          git add -f -- data/*_source/source_artifacts/data/daily || true
          # Ensure raw statsapi feed files are published when present
          git add -f -- data/*_source/source_artifacts/data/raw || true
          git add -f -- data/*_source/source_artifacts/data/raw/** || true
          git add -f -- data/mlb_source/source_artifacts || true
          git add -f -- data/mlb_source/manifests || true
          git add -f -- reports/intelligence || true
          git add -f -- reports/daily_update/latest || true
          git add -f -- reports/refresh_status/latest || true
          git add -f -- reports/odds_control_plane || true

          # Fallback: add all changes except the verbose daily log
          git add -A -- . ':(exclude)daily-update.log'

          # Show staged files for debugging
          Write-Host 'Staged files:'
          git --no-pager status --porcelain=v1

          $status = git status --short
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host 'No pipeline output changes detected; skipping commit and push.'
            exit 0
          }

          Write-Host 'Pipeline output changes detected:'
          Write-Host $status

          git commit -m "Update daily pipeline outputs" || true
          $branch = $env:GITHUB_REF_NAME
          Write-Host "Preparing to push commit to origin/$branch"

          # Verify at least one published artifact tree is present in HEAD; fail loudly if missing.
          $filesInHead = git --no-pager show --name-only --pretty=format:'' HEAD
          Write-Host 'Files included in HEAD commit:'
          Write-Host $filesInHead
          $artifactTreePresent = ($filesInHead | Select-String -Pattern '^data/[^/]+_source/(source_artifacts|manifests)/' -Quiet)
          if (-not $artifactTreePresent) {
            Write-Error 'ERROR: artifacts not found in HEAD commit; failing workflow to indicate Stage 2 failure.'
            exit 1
          }

          # Ensure push uses the available GitHub token if needed
          if ($env:GITHUB_TOKEN) {
            $repo = "${{ github.repository }}"
            git remote set-url origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$repo"
          }

          git fetch origin $branch || true
          git rebase "origin/$branch" || true
          Write-Host "Pushing commit to origin/$branch"
          git push origin "HEAD:$branch"

      - name: Upload daily update log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-log
          path: daily-update.log
