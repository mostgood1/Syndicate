name: Daily Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Run date in YYYY-MM-DD format'
        required: false
        type: string
      active_sports:
        description: 'Optional comma-separated list of sports to run, e.g. WNBA'
        required: false
        type: string
      base_url:
        description: 'Optional base URL passed to the daily update script'
        required: false
        type: string
      event_sim_force_window_minutes:
        description: 'Optional force window in minutes for event simulation'
        required: false
        type: number
        default: 30

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: windows-latest
    env:
      DAILY_UPDATE_DATE: ${{ github.event.inputs.date || '' }}
      DAILY_UPDATE_ACTIVE_SPORTS: ${{ github.event.inputs.active_sports || '' }}
      DAILY_UPDATE_BASE_URL: ${{ github.event.inputs.base_url || '' }}
      DAILY_UPDATE_FORCE_WINDOW_MINUTES: ${{ github.event.inputs.event_sim_force_window_minutes || 30 }}
      DAILY_UPDATE_FORCE_REBUILD_TODAY: ${{ github.run_attempt > 1 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print runtime diagnostics
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --short --branch
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Capture Python path
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON_PATH=$python" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Captured Python: $python"

      - name: Resolve runtime parameters
        shell: pwsh
        run: |
          $runDate = if ($env:DAILY_UPDATE_DATE) { $env:DAILY_UPDATE_DATE } else { (Get-Date).ToString('yyyy-MM-dd') }
          $baseUrl = if ($env:DAILY_UPDATE_BASE_URL) { $env:DAILY_UPDATE_BASE_URL } else { '' }
          $forceWindow = if ($env:DAILY_UPDATE_FORCE_WINDOW_MINUTES) { [int]$env:DAILY_UPDATE_FORCE_WINDOW_MINUTES } else { 30 }

          "DATE=$runDate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASE_URL=$baseUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "EVENT_SIM_FORCE_WINDOW_MINUTES=$forceWindow" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Resolved daily update parameters:"
          Write-Host "  Date: $runDate"
          Write-Host "  BaseUrl: $(if ($baseUrl) { $baseUrl } else { '<empty>' })"
          Write-Host "  EventSimForceWindowMinutes: $forceWindow"

      - name: Run archive smoke test
        run: python -m unittest tests.test_daily_update_smoke || true

      - name: Run active-sport gate regression
        run: python -m unittest tests.test_migration_gate.MigrationGateRuntimeDependencyTests.test_evaluate_active_sport_advanced_readiness_skips_out_of_season_and_no_games

      - name: Run daily update contract regressions
        run: >
          python -m unittest
          tests.test_daily_update_root_launcher
          tests.test_daily_update_workflow
          tests.test_daily_update_odds_passthrough
          tests.test_unified_daily_update_dynamic_sim_execution_decision
          tests.test_unified_daily_update_plan_driven_artifact_generation
          tests.test_daily_update_simulation_contract
          tests.test_daily_update_simulation_contract_scaffold
          tests.test_unified_daily_update_run_state_scaffold
          tests.test_unified_daily_update_sim_trace_scaffold
          tests.test_unified_daily_update_status_artifact_scaffold
          tests.test_wnba_cards_merge_aliases
          tests.test_game_board_simulation_contract
          tests.test_simulation_adapter

      - name: Run daily pipeline
        shell: pwsh
        run: |
          Write-Host 'Starting daily_update_in_season.ps1'
          Write-Host "Using Date=$env:DATE"
          Write-Host "Using ActiveSports=$(if ($env:DAILY_UPDATE_ACTIVE_SPORTS) { $env:DAILY_UPDATE_ACTIVE_SPORTS } else { '<empty>' })"
          Write-Host "Using BaseUrl=$(if ($env:BASE_URL) { $env:BASE_URL } else { '<empty>' })"
          Write-Host "Using EventSimForceWindowMinutes=$env:EVENT_SIM_FORCE_WINDOW_MINUTES"

          # ✅ Get correct Python path
          $python = $env:PYTHON_PATH.Split("`n")[0].Trim()
          Write-Host "Using Python at: $python"

          # ✅ Force Python into PATH (THIS IS THE MISSING PIECE)
          $pythonDir = Split-Path $python
          $env:PATH = "$pythonDir;$env:PATH"

          $forceWindowMinutes = [int]$env:EVENT_SIM_FORCE_WINDOW_MINUTES
          $forceRebuildToday = [string]$env:DAILY_UPDATE_FORCE_REBUILD_TODAY -eq 'True' -or [string]$env:DAILY_UPDATE_FORCE_REBUILD_TODAY -eq 'true'
          $activeSports = @()
          if (-not [string]::IsNullOrWhiteSpace($env:DAILY_UPDATE_ACTIVE_SPORTS)) {
            $activeSports = @(
              $env:DAILY_UPDATE_ACTIVE_SPORTS -split '[, ]+' |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
          }

          $dailyArgs = [ordered]@{
            Date = $env:DATE
            RefreshOdds = $true
            OddsPhase = 'all'
            OddsSports = 'all'
            OddsRegions = 'us'
            SkipGitPush = $true
            EventSimForceWindowMinutes = $forceWindowMinutes
          }

          if (-not [string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            $dailyArgs.BaseUrl = $env:BASE_URL
          }

          if ($activeSports.Count -gt 0) {
            $dailyArgs.ActiveSports = @($activeSports)
          }

          if ($forceRebuildToday) {
            $dailyArgs.ForceRebuildToday = $true
          }

          $scriptPath = './scripts/daily_update.ps1'
          if ($activeSports.Count -eq 0) {
            $scriptPath = './scripts/daily_update_in_season.ps1'
          }

          Write-Host "Invoking: $scriptPath $((($dailyArgs.GetEnumerator() | ForEach-Object {
            if ($_.Value -is [System.Collections.IEnumerable] -and -not ($_.Value -is [string])) {
              "-{0} {1}" -f $_.Key, (@($_.Value) -join ' ')
            }
            elseif ($_.Value -is [bool]) {
              if ($_.Value) { "-{0}" -f $_.Key } else { $null }
            }
            else {
              "-{0} {1}" -f $_.Key, $_.Value
            }
          } | Where-Object { $_ }) -join ' ')"
          & $scriptPath @dailyArgs 2>&1 | Tee-Object -FilePath daily-update.log

          $exitCode = $LASTEXITCODE
          Write-Host "scripts/daily_update.ps1 exited with code $exitCode"
          exit $exitCode
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push pipeline outputs
        shell: pwsh
        run: |
          $repoRoot = (Get-Location).Path
          function Convert-ToRelativeGitPath {
            param([string]$FullPath)

            if ([string]::IsNullOrWhiteSpace($FullPath)) {
              return $null
            }

            $resolvedPath = (Resolve-Path -LiteralPath $FullPath).Path
            return $resolvedPath.Substring($repoRoot.Length + 1) -replace '\\', '/'
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          $stageRoots = [System.Collections.Generic.List[string]]::new()

          foreach ($sourceRoot in @(Get-ChildItem -Path 'data' -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*_source' })) {
            foreach ($candidateRoot in @(
              (Join-Path $sourceRoot.FullName 'manifests'),
              (Join-Path $sourceRoot.FullName 'source_artifacts\data\daily'),
              (Join-Path $sourceRoot.FullName 'source_artifacts\data\processed'),
              (Join-Path $sourceRoot.FullName 'source_artifacts\data\live_lens')
            )) {
              if (Test-Path $candidateRoot) {
                $relativeRoot = Convert-ToRelativeGitPath -FullPath $candidateRoot
                if ($relativeRoot) {
                  $stageRoots.Add($relativeRoot) | Out-Null
                }
              }
            }
          }

          foreach ($candidateRoot in @(
            'reports/intelligence',
            'reports/daily_update/latest',
            'reports/refresh_status/latest',
            'reports/odds_control_plane'
          )) {
            if (Test-Path $candidateRoot) {
              $relativeRoot = Convert-ToRelativeGitPath -FullPath $candidateRoot
              if ($relativeRoot) {
                $stageRoots.Add($relativeRoot) | Out-Null
              }
            }
          }

          if ($stageRoots.Count -gt 0) {
            Write-Host 'Staging roots:'
            Write-Host ($stageRoots -join "`n")
            git add -A -f -- @stageRoots
          }

          # Show staged files for debugging
          Write-Host 'Staged files:'
          git --no-pager status --porcelain=v1

          $status = git status --short
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host 'No pipeline output changes detected; skipping commit and push.'
            exit 0
          }

          Write-Host 'Pipeline output changes detected:'
          Write-Host $status

          $stagedFiles = @(& git diff --cached --name-only --relative)
          Write-Host 'Files staged for commit:'
          Write-Host ($stagedFiles -join "`n")
          $artifactTreePresent = ($stagedFiles | Select-String -Pattern '^data/[^/]+_source/(manifests|source_artifacts)/' -Quiet)
          if (-not $artifactTreePresent) {
            Write-Error 'ERROR: artifacts not found in staged pipeline outputs; failing workflow to indicate Stage 2 failure.'
            exit 1
          }

          git commit -m "Update daily pipeline outputs"
          $branch = $env:GITHUB_REF_NAME
          Write-Host "Preparing to push commit to origin/$branch"

          # Ensure push uses the available GitHub token if needed
          if ($env:GITHUB_TOKEN) {
            $repo = "${{ github.repository }}"
            git remote set-url origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$repo"
          }

          git fetch origin $branch
          git rebase --autostash "origin/$branch"
          Write-Host "Pushing commit to origin/$branch"
          git push origin "HEAD:$branch"

      - name: Upload daily update log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-log
          path: daily-update.log
