        value: /opt/render/project/data/mlb_source/source_artifacts/data/live_lens
      - key: NBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/nba_source/data
      - key: NBA_LIVE_LENS_DIR
        value: /opt/render/project/data/nba_source/source_artifacts/data/live_lens
      - key: NHL_DATA_DIR
        value: ./data/nhl_source/source_artifacts/data
      - key: NHL_LIVE_LENS_DIR
        value: ./data/nhl_source/source_artifacts/data/live_lens
      - key: WNBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/wnba_source/data
      - key: WNBA_LIVE_LENS_DIR
        value: /opt/render/project/data/wnba_source/source_artifacts/data/live_lens
      - key: SYNDICATE_WNBA_SOURCE_APP_FALLBACK
        value: "false"
      # 2026-07-19: yesterday's smart-sim engine upgrade (25f34697) raised the
      # default 150 -> 500, benchmarked safe in isolation but not against a
      # busy live session's concurrent MLB sim/refresh memory pressure in the
      # same 2048MB container. This runs in-process (cli_module.cli.main(),
      # not a subprocess -- see refresh_wnba_oddsapi_props.py's
      # _run_source_cli_command), so its possession-level Monte Carlo cost
      # lives entirely inside refresh_wnba_oddsapi_props.py's own RSS. First
      # cut to 250 wasn't enough -- observed the container hit 100%
      # (2048/2048MB) with this process alone at 1.5GB+ RSS, correlating with
      # a live-odds-worker restart, even after that change. --smart-sim-pbp
      # (possession-level mode, stays on) is what produces quarter/interval
      # props, so n_sims -- not disabling pbp -- is the lever that trades
      # memory for prediction precision without losing that feature.
      - key: REFRESH_PREDICT_PROPS_SMART_SIM_N_SIMS
        value: "100"
      - key: MLB_ENABLE_LIVE_LENS_LOOP
        value: "true"
      - key: MLB_ENABLE_LIVE_LENS_BACKGROUND_REPORTS
        # Syndicate's own live_lens_loop.py (SYNDICATE_ENABLE_LIVE_LENS_LOOP
        # below) is now the sole trigger of the expensive
        # _persist_live_lens_report/estimate_live sweep for MLB. This vendor
        # loop's own report-refresh trigger raced it uncoordinated in the same
        # process (see docs/fix_notes_log.md / commit 9307fb80) -- disabling
