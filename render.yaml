# Keep this file changing when we need to force a fresh Render deploy after data refresh fixes.
# Force redeploy after published artifact root bootstrap sync fix.
# Force redeploy after WNBA 2026-06-18 artifact bundle.
# Force redeploy after NHL source_artifacts path fix.
# Force redeploy after MLB source_artifacts path fix.
# Force redeploy after MLB live-lens rebuild fallback.
# Force redeploy after MLB live-lens deployment lag.
# Force redeploy after stalled Render healthz commit.
# Force redeploy after WNBA live game lens interval odds fix.
# Force redeploy after WNBA 2026-06-06 live lens fixes
# Force redeploy after WNBA live-player odds fallback fix
# Force redeploy after WNBA canonical live-lines source fix.
# Force redeploy after Render runtime parity fix.
services:
  - type: keyvalue
    name: syndicate-refresh-state
    ipAllowList: []
  - type: web
    name: syndicate
    env: python
    plan: standard
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'PORT=${PORT:-10000}; exec gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --threads ${GUNICORN_THREADS:-1} --timeout ${GUNICORN_TIMEOUT:-60} --graceful-timeout ${GUNICORN_GRACEFUL_TIMEOUT:-30} --keep-alive ${GUNICORN_KEEPALIVE:-5}'
    healthCheckPath: /healthz
    disk:
      name: syndicate-data-web
      mountPath: /opt/render/project/data
      sizeGB: 50
    envVars: &shared_render_env_vars
      - key: TZ
        value: America/Chicago
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ODDS_API_KEY
        value: 77ae1c35140c82da1675af85dde36a44
      # Ask the Syndicate LLM briefings (Claude API). Set the value in the
      # Render dashboard; when absent the endpoint serves snapshot-only
      # responses (no error, no LLM call).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SYNDICATE_ASK_MODEL
        value: claude-haiku-4-5
      # Per-process cap on Claude calls (calls per window) so the public,
      # unauthenticated /api/syndicate/query endpoint can't be used to run up
      # API spend; excess traffic degrades to the snapshot response.
      - key: SYNDICATE_ASK_LLM_MAX_CALLS
        value: "30"
      - key: SYNDICATE_ASK_LLM_WINDOW_SECONDS
        value: "600"
      - key: SYNDICATE_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_WEB_DYNO
        value: "true"
      # Root-caused 2026-07-23: refresh-worker's frequent MLB-only autorun was
      # winning a mutex SHARED GLOBALLY across all 3 services almost every
      # cycle, starving out live-odds-worker's own tick -- the only path that
      # ever refreshes WNBA/soccer/everything else. Each service gets its own
      # independent "one run at a time" lane instead. Starts false (zero
      # behavior change); flip true on all 3 services together once reviewed.
      - key: SYNDICATE_REFRESH_RUN_PER_SERVICE_LANES
        value: "true"
      - key: SYNDICATE_REFRESH_LANE
        value: web
      - key: SYNDICATE_REQUIRE_HOSTED_STORAGE
        value: "true"
      - key: SYNDICATE_REFRESH_STATE_BACKEND
        value: keyvalue
      - key: SYNDICATE_REFRESH_STATE_URL
        fromService:
          name: syndicate-refresh-state
          type: keyvalue
          property: connectionString
      - key: SYNDICATE_BOOTSTRAP_ON_START
        value: "1"
      - key: SYNDICATE_DATA_ROOT
        value: /opt/render/project/data
      - key: SYNDICATE_MLB_SOURCE_ROOT
        value: /opt/render/project/data/mlb_source
      - key: SYNDICATE_NBA_SOURCE_ROOT
        value: /opt/render/project/data/nba_source
      - key: SYNDICATE_NBA_ARTIFACT_ROOT
        value: /opt/render/project/data/nba_source/source_artifacts
      - key: SYNDICATE_NHL_SOURCE_ROOT
        value: /opt/render/project/data/nhl_source
      - key: SYNDICATE_BOOTSTRAP_WNBA_TODAY
        value: "0"
      - key: SYNDICATE_NFL_SOURCE_ROOT
        value: /opt/render/project/data/nfl_source
      - key: SYNDICATE_NCAAF_SOURCE_ROOT
        value: /opt/render/project/data/ncaaf_source
      - key: SYNDICATE_NCAAB_SOURCE_ROOT
        value: /opt/render/project/data/ncaab_source
      - key: SYNDICATE_WNBA_SOURCE_ROOT
        value: /opt/render/project/data/wnba_source
      - key: SYNDICATE_REPORTS_ROOT
        value: /opt/render/project/data/reports
      - key: SYNDICATE_NBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_WNBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_NHL_SOURCE_CLI_GENERATION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      # 2 workers x 1 thread meant only TWO concurrent requests for the whole
      # service, and Render's health check gives /healthz 5 seconds. On
      # 2026-07-25 that combination killed the web instance repeatedly:
      # "HTTP health check failed (timed out after 5 seconds)" -- not an OOM,
      # just starvation. Two slow requests were enough to make /healthz
      # unanswerable, and this service also persists intelligence state on the
      # REQUEST path (SYNDICATE_ENABLE_INTELLIGENCE_STATE_BACKGROUND_LOOP is
      # false here, see pipeline/intelligence_state.py), so slow requests are
      # routine rather than exceptional.
      #
      # Threads, not workers: each extra gunicorn worker is a whole extra
      # process on a 2GB instance, whereas threads cost almost nothing and
      # this starvation is I/O-bound waiting, not CPU saturation.
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "60"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      - key: SYNDICATE_ENABLE_INTELLIGENCE_STATE_BACKGROUND_LOOP
        value: "false"
      - key: SYNDICATE_ENABLE_LIVE_ODDS_REFRESH_LOOP
        value: "false"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_INTERVAL_SECONDS
        value: "60"
      # Execute refresh jobs directly so MLB odds updates can publish on Render.
      - key: SYNDICATE_LIVE_ODDS_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_INTELLIGENCE_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_PHASE
        value: "live"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_EXECUTION_MODE
        value: "source"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_MODE
        value: "full"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_REGIONS
        value: us
      - key: SYNDICATE_LIVE_ODDS_REFRESH_SKIP_MIRROR
        value: "true"
      - key: MLB_BETTING_DATA_ROOT
        value: /opt/render/project/data/mlb_source/source_artifacts/data
      - key: MLB_LIVE_LENS_DIR
        value: /opt/render/project/data/mlb_source/source_artifacts/data/live_lens
      - key: NBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/nba_source/data
      - key: NBA_LIVE_LENS_DIR
        value: /opt/render/project/data/nba_source/source_artifacts/data/live_lens
      - key: NHL_DATA_DIR
        value: ./data/nhl_source/source_artifacts/data
      - key: NHL_LIVE_LENS_DIR
        value: ./data/nhl_source/source_artifacts/data/live_lens
      - key: WNBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/wnba_source/data
      - key: WNBA_LIVE_LENS_DIR
        value: /opt/render/project/data/wnba_source/source_artifacts/data/live_lens
      - key: SYNDICATE_WNBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: MLB_ENABLE_LIVE_LENS_LOOP
        value: "false"
      - key: MLB_ENABLE_LIVE_LENS_BACKGROUND_REPORTS
        value: "false"
      - key: MLB_ENABLE_REFRESH_WORKER_AUTORUN
        value: "true"
      - key: MLB_LIVE_LENS_LOOP_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_LENS_REPORT_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: MLB_LIVE_LENS_REPORT_MAX_AGE_SECONDS
        value: "60"
      - key: MLB_LIVE_ODDSAPI_REFRESH_INTERVAL_SECONDS
        value: "60"
      # Phase 1 of migrating off the daily-update GHA cron: NFL/NCAAF/NCAAB
      # have no live worker coverage today (live_refresh_loop.py's adaptive
      # tick only covers MLB/NBA/WNBA/NHL), so they only ever refreshed via
      # the daily Action. Mirrors MLB_ENABLE_REFRESH_WORKER_AUTORUN above but
      # gated by season windows (these are weekly, not daily, sports) via
      # _active_weekly_sports_for_date(); defaults off for the same
      # dark-launch reasoning used elsewhere in this file.
      - key: WEEKLY_SPORTS_ENABLE_REFRESH_WORKER_AUTORUN
        value: "false"
      - key: WEEKLY_SPORTS_REFRESH_INTERVAL_SECONDS
        value: "21600"
      # #96: RECONCILIATION_ENABLE_REFRESH_WORKER_AUTORUN/
      # RECONCILIATION_REFRESH_INTERVAL_SECONDS moved from here to the
      # refresh-worker service's own envVars block below. This `envVars:`
      # list only applies to THIS (web) service -- despite being anchored
      # `&shared_render_env_vars`, the alias is never referenced anywhere
      # else in this file, so nothing was ever actually shared. The code
      # that reads these two keys (scripts/run_refresh_worker.py's
      # _reconciliation_auto_refresh_enabled/_reconciliation_interval_seconds)
      # runs as the refresh-worker SERVICE's own process, which never saw
      # this key at all (absent, not "false") -- so flipping the value here
      # to "true" would have had zero effect. Confirmed live 2026-07-28: the
      # evaluation ledger's entire ~1350-record history is 100% `result:
      # "pending"`, proving reconciliation autorun has never actually run on
      # Render regardless of this flag's value here.
      # Play-by-play-level smart sim re-enabled: the OOM this originally
      # mitigated was root-caused to the live-odds-worker's fixed 60s tick
      # relaunching the full pipeline before the previous attempt finished
      # (since fixed with adaptive intervals, pregame relaunch cooldown, and
      # periodic worker recycling). PBP mode drives quarter scores from
      # possession simulation and returns real per-minute scoring buckets.
      - key: REFRESH_PREDICT_PROPS_SMART_SIM_PBP
        value: "true"

  - type: worker
    name: refresh-worker
    env: python
    # pro (4GB), upgraded 2026-07-25. Do NOT drop back to standard (2GB):
    # this service hosts the MLB sim, measured at 1674MB peak running alone,
    # which leaves ~374MB of a 2GB box for the worker, an odds-refresh tree
    # (~532MB) and the intelligence board build (~700MB idle, 1479MB peak).
    # It was OOM-killed 19 times on 2026-07-25 at standard; the other two
    # services were killed zero times.
    plan: pro
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_refresh_worker.py
    disk:
      name: syndicate-data-refresh-worker
      mountPath: /opt/render/project/data
      sizeGB: 50
    envVars:
      - key: TZ
        value: America/Chicago
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: ODDS_API_KEY
        value: 77ae1c35140c82da1675af85dde36a44
      - key: SYNDICATE_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_WEB_DYNO
        value: "false"
      # See the matching comment on the syndicate web service above --
      # per-service refresh-run lanes fix the soccer/WNBA starvation bug
      # traced to refresh-worker's own frequent MLB-only autorun winning a
      # globally-shared mutex almost every cycle. Starts false; flip true on
      # all 3 services together once reviewed.
      - key: SYNDICATE_REFRESH_RUN_PER_SERVICE_LANES
        value: "true"
      - key: SYNDICATE_REFRESH_LANE
        value: refresh-worker
      # #96/#120: moved here from the web service's envVars block, where it
      # sat inert -- run_refresh_worker.py (this service's own startCommand)
      # is the actual reader of these two keys, and web's copy of them was
      # never visible to this process at all. Flipping true here for the
      # first time; NBA/WNBA/NHL have real actuals writers
      # (refresh_{nba,wnba,nhl}_oddsapi{_props}.py) so those sports should
      # start settling. MLB has no actuals writer at all (see the matcher in
      # prediction_reconciliation.py, and the follow-up scoping note in
      # todo.md) -- MLB predictions will keep reading "pending" until that's
      # built separately; this flag alone does not fix MLB.
      - key: RECONCILIATION_ENABLE_REFRESH_WORKER_AUTORUN
        value: "true"
      - key: RECONCILIATION_REFRESH_INTERVAL_SECONDS
        value: "86400"
      # MLB's own actuals writer (scripts/build_mlb_actuals.py) -- the "MLB
      # has no actuals writer at all" gap the comment above calls out.
      # Reads daily_top_props + each game's cached box score, writes
      # props_actuals_{date}.csv (the RECONCILIATION_PATTERNS-recognized
      # format), so the reconciliation autorun above has something to match
      # MLB predictions against. Own flag/interval, independent of the
      # reconciliation autorun's -- both must be true for MLB predictions to
      # actually settle.
      - key: RECONCILIATION_ENABLE_MLB_ACTUALS_WRITER
        value: "true"
      - key: RECONCILIATION_MLB_ACTUALS_WRITER_INTERVAL_SECONDS
        value: "3600"
      - key: SYNDICATE_REQUIRE_HOSTED_STORAGE
        value: "true"
      - key: SYNDICATE_REFRESH_STATE_BACKEND
        value: keyvalue
      - key: SYNDICATE_REFRESH_STATE_URL
        fromService:
          name: syndicate-refresh-state
          type: keyvalue
          property: connectionString
      - key: SYNDICATE_BOOTSTRAP_ON_START
        value: "1"
      - key: SYNDICATE_DATA_ROOT
        value: /opt/render/project/data
      - key: SYNDICATE_MLB_SOURCE_ROOT
        value: /opt/render/project/data/mlb_source
      - key: SYNDICATE_NBA_SOURCE_ROOT
        value: /opt/render/project/data/nba_source
      - key: SYNDICATE_NBA_ARTIFACT_ROOT
        value: /opt/render/project/data/nba_source/source_artifacts
      - key: SYNDICATE_NHL_SOURCE_ROOT
        value: /opt/render/project/data/nhl_source
      - key: SYNDICATE_NFL_SOURCE_ROOT
        value: /opt/render/project/data/nfl_source
      - key: SYNDICATE_NCAAF_SOURCE_ROOT
        value: /opt/render/project/data/ncaaf_source
      - key: SYNDICATE_NCAAB_SOURCE_ROOT
        value: /opt/render/project/data/ncaab_source
      - key: SYNDICATE_WNBA_SOURCE_ROOT
        value: /opt/render/project/data/wnba_source
      - key: SYNDICATE_REPORTS_ROOT
        value: /opt/render/project/data/reports
      - key: SYNDICATE_WEB_PUBLISH_URL
        value: https://syndicate-an21.onrender.com
      - key: SYNDICATE_BOOTSTRAP_ON_START
        value: "1"
      - key: SYNDICATE_BOOTSTRAP_WNBA_TODAY
        value: "1"
      - key: SYNDICATE_NBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_WNBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_NHL_SOURCE_CLI_GENERATION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "60"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      # ENABLED here. This service owns the intelligence-state background loop.
      #
      # History, because the comment that used to sit here said the opposite and
      # survived the fix (see #70): this was DISABLED on 2026-07-25 to stop an
      # OOM crash loop. That was a CAPACITY problem, not a scheduling one -- once
      # MLB games went live the board build alone exceeded the then-2GB
      # container, measured ~700MB idle spiking past 1479MB on pipeline ticks,
      # OOM-looping every 15-30s with the MLB sim confirmed deferring and never
      # launching. The #55 sim/pipeline alternation is correct and still needed,
      # but it does not help when one side alone does not fit.
      #
      # RESOLVED by capacity, not by placement: this service was upgraded to
      # pro/4GB (see the `plan` pin above), which is why the loop lives here
      # again. Moving it to live-odds-worker was evaluated and rejected -- that
      # box runs the WNBA refresh leg in 2048MB.
      #
      # Exactly ONE service may own this loop. web and live-odds-worker are both
      # "false" for that reason; two owners would recompute the same state
      # concurrently and reproduce the collision on a different box.
      - key: SYNDICATE_ENABLE_INTELLIGENCE_STATE_BACKGROUND_LOOP
        value: "true"
      - key: SYNDICATE_ENABLE_LIVE_ODDS_REFRESH_LOOP
        value: "false"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_IDLE_INTERVAL_SECONDS
        value: "900"
      - key: SYNDICATE_INTELLIGENCE_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_LIVE_ODDS_REFRESH_PHASE
        value: "live"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_EXECUTION_MODE
        value: "source"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_MODE
        value: "full"
      - key: SYNDICATE_SERIAL_SPORT_REFRESH
        value: "true"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_REGIONS
        value: us
      - key: SYNDICATE_LIVE_ODDS_REFRESH_SKIP_MIRROR
        value: "true"
      - key: MLB_BETTING_DATA_ROOT
        value: /opt/render/project/data/mlb_source/source_artifacts/data
      - key: MLB_LIVE_LENS_DIR
        value: /opt/render/project/data/mlb_source/source_artifacts/data/live_lens
      - key: NBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/nba_source/data
      - key: NBA_LIVE_LENS_DIR
        value: /opt/render/project/data/nba_source/source_artifacts/data/live_lens
      - key: NHL_DATA_DIR
        value: ./data/nhl_source/source_artifacts/data
      - key: NHL_LIVE_LENS_DIR
        value: ./data/nhl_source/source_artifacts/data/live_lens
      - key: WNBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/wnba_source/data
      - key: WNBA_LIVE_LENS_DIR
        value: /opt/render/project/data/wnba_source/source_artifacts/data/live_lens
      - key: MLB_ENABLE_LIVE_LENS_LOOP
        value: "false"
      - key: MLB_ENABLE_LIVE_LENS_BACKGROUND_REPORTS
        value: "false"
      - key: MLB_LIVE_LENS_LOOP_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_LENS_REPORT_REFRESH_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_ODDSAPI_REFRESH_INTERVAL_SECONDS
        value: "60"
      # Play-by-play-level smart sim re-enabled: the OOM this originally
      # mitigated was root-caused to the live-odds-worker's fixed 60s tick
      # relaunching the full pipeline before the previous attempt finished
      # (since fixed with adaptive intervals, pregame relaunch cooldown, and
      # periodic worker recycling). PBP mode drives quarter scores from
      # possession simulation and returns real per-minute scoring buckets.
      - key: REFRESH_PREDICT_PROPS_SMART_SIM_PBP
        value: "true"
      # #129: MLB_ENABLE_REFRESH_WORKER_AUTORUN turned this worker into a
      # SECOND independent OddsAPI caller for MLB (via _launch_autorun_mlb_refresh
      # -> refresh_odds_sources.py), duplicating live-odds-worker's own odds
      # ownership and burning real OddsAPI credit budget for no benefit --
      # confirmed live in production (a real "phase=live" mlb refresh_odds_sources
      # run at 2026-07-29T13:57:03Z, ~20s from live-odds-worker's own tick
      # deciding independently whether MLB needed a refresh). Its own staleness
      # gate (_mlb_live_lens_report_path) checks a file that nothing ever
      # writes/pulls onto this service's disk, so the gate never actually
      # blocked anything. Turned back off -- live-odds-worker
      # (SYNDICATE_MLB_REFRESH_TICK_OWNER=true there now) is the sole MLB
      # odds-refresh owner again. Only the heavy 1000-sim Monte Carlo job
      # (SYNDICATE_ENABLE_MLB_DAILY_SIM_TRIGGER/SYNDICATE_MLB_SIM_TICK_OWNER
      # below, unrelated to odds) stays isolated here -- that isolation was
      # the legitimate reason for the 2026-07-20 move and doesn't need OddsAPI
      # access of its own (see run_mlb_daily_sim_job.py's --refresh-current-oddsapi off).
      - key: MLB_ENABLE_REFRESH_WORKER_AUTORUN
        value: "false"
      - key: WEEKLY_SPORTS_ENABLE_REFRESH_WORKER_AUTORUN
        value: "true"
      - key: WEEKLY_SPORTS_REFRESH_INTERVAL_SECONDS
        value: "21600"
      # 2026-07-29, per explicit user direction: soccer (MLS in season now)
      # gets its own dedicated autorun rather than joining the
      # WEEKLY_SPORTS_* one above (which is NFL/NCAAF/NCAAB-only, both by
      # code -- _active_weekly_sports_for_date hard-codes that tuple -- and
      # by intent, so fixing soccer doesn't touch their already-live
      # cadence). Confirmed live: soccer's pregame-only steps (schedule/
      # odds/props/picks) never ran anywhere in production, because
      # live-odds-worker -- the only service with the live-odds refresh
      # loop on -- is pinned to phase=live, and those steps are
      # phases=("pregame",). This week's Saturday MLS fixtures showed
      # is_unsimulated_placeholder=True on /soccer/mls/api/cards as a
      # result (matches todo #52: "71% of MLS board has no sim projection
      # at all"). _launch_autorun_soccer_weekly_refresh (run_refresh_worker.py)
      # originally ran phase="all" so schedule/odds/props/picks (pregame-only)
      # and artifacts/live_state (pregame+live / live-only) all ran together.
      #
      # #148: narrowed to phase="live" -- phase="all" made refresh-worker a
      # second direct OddsAPI caller for soccer (a duplicate-cost ownership
      # violation, same class as MLB's #139/#144). The pregame-only steps
      # (schedule/odds/props/picks) are now owned by live-odds-worker's own
      # dedicated SYNDICATE_ENABLE_SOCCER_PREGAME_REFRESH_AUTORUN (see that
      # worker's block below). This autorun keeps only the sim
      # (soccer_{league}_artifacts, phases=("pregame","live")) and live_state.
      - key: SYNDICATE_ENABLE_SOCCER_WEEKLY_REFRESH_AUTORUN
        value: "true"
      - key: SYNDICATE_SOCCER_WEEKLY_REFRESH_INTERVAL_SECONDS
        value: "14400"
      # Same ownership-split pattern as SYNDICATE_MLB_REFRESH_TICK_OWNER below
      # (mirrored on live-odds-worker, set to "false" there): without this,
      # live-odds-worker's combined tick and this autorun would both target
      # the identical in-season nfl/ncaaf/ncaab artifacts the moment those
      # sports are back in season -- a real write race, not just wasted work,
      # dormant only because they're all off-season right now.
      - key: WEEKLY_SPORTS_REFRESH_TICK_OWNER
        value: "true"
      # MLB daily sim / look-ahead / evening-next-day sim: relocated here
      # 2026-07-20 from live-odds-worker to isolate the 1000-sim Monte Carlo
      # job's memory footprint from that worker's odds-refresh + NBA/WNBA
      # SmartSim + live-lens load (documented OOM history there: sim workers
      # cut to 1, WNBA sim count cut 500->250->100). refresh-worker was
      # otherwise idle capacity already being paid for. See
      # scripts/run_refresh_worker.py's call to
      # syndicate.features.shared.live_refresh_loop._run_mlb_sim_tick().
      # Re-enabled 2026-07-25 AFTER the #55 fix landed. It was disabled for
      # part of that afternoon to stop an OOM crash loop: the sim fires ~5s
      # after every boot once the evening slate is inside its tip-off window,
      # concurrently with the intelligence board build this same worker runs,
      # and together they exceed the 2GB container. The launch-time memory
      # gate never caught it because it measures at ~250MB, before either
      # pipeline grows.
      #
      # What makes this safe now is the other side of the bound: the
      # intelligence loop yields while a sim subprocess is resident (see
      # _mlb_sim_subprocess_running in pipeline/intelligence_state.py). If
      # that is ever disabled via SYNDICATE_INTELLIGENCE_DEFER_TO_MLB_SIM,
      # this must go back to "false" or the crash loop returns.
      - key: SYNDICATE_ENABLE_MLB_DAILY_SIM_TRIGGER
        value: "true"
      - key: SYNDICATE_EVENT_SIM_FORCE_WINDOW_MINUTES
        value: "30"
      - key: SYNDICATE_MLB_SIM_CHECK_INTERVAL_SECONDS
        value: "600"
      - key: SYNDICATE_MLB_SIM_TIMEOUT_SECONDS
        value: "2700"
      - key: SYNDICATE_MLB_SIM_COUNT
        value: "1000"
      # No longer sharing a container with odds refresh / SmartSim / live-lens,
      # so the memory pressure that forced this down to 1 worker on
      # live-odds-worker shouldn't apply here -- but keeping it at 1 for the
      # first cycle on the new service until a clean run confirms real
      # headroom before raising it.
      - key: SYNDICATE_MLB_SIM_WORKERS
        value: "1"
      - key: SYNDICATE_SCHEDULE_ADAPTER_TTL_SECONDS
        value: "900"
      - key: SYNDICATE_LOOK_AHEAD_ENABLED
        value: "true"
      - key: SYNDICATE_LOOK_AHEAD_INTERVAL_SECONDS
        value: "3600"
      - key: SYNDICATE_MLB_EVENING_NEXT_DAY_SIM_ENABLED
        value: "true"
      - key: SYNDICATE_MLB_EVENING_NEXT_DAY_SIM_START_HOUR
        value: "18"

  - type: worker
    name: live-odds-worker
    env: python
    plan: standard
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_live_odds_refresh_worker.py
    disk:
      name: syndicate-data-live-odds-worker
      mountPath: /opt/render/project/data
      sizeGB: 50
    envVars:
      - key: TZ
        value: America/Chicago
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: ODDS_API_KEY
        value: 77ae1c35140c82da1675af85dde36a44
      - key: SYNDICATE_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_WEB_DYNO
        value: "false"
      # See the matching comment on the syndicate web service above --
      # per-service refresh-run lanes fix the soccer/WNBA starvation bug
      # traced to refresh-worker's own frequent MLB-only autorun winning a
      # globally-shared mutex almost every cycle. Starts false; flip true on
      # all 3 services together once reviewed.
      - key: SYNDICATE_REFRESH_RUN_PER_SERVICE_LANES
        value: "true"
      - key: SYNDICATE_REFRESH_LANE
        value: live-odds-worker
      - key: SYNDICATE_REQUIRE_HOSTED_STORAGE
        value: "true"
      - key: SYNDICATE_REFRESH_STATE_BACKEND
        value: keyvalue
      - key: SYNDICATE_REFRESH_STATE_URL
        fromService:
          name: syndicate-refresh-state
          type: keyvalue
          property: connectionString
      - key: SYNDICATE_BOOTSTRAP_ON_START
        value: "1"
      - key: SYNDICATE_DATA_ROOT
        value: /opt/render/project/data
      - key: SYNDICATE_MLB_SOURCE_ROOT
        value: /opt/render/project/data/mlb_source
      - key: SYNDICATE_NBA_SOURCE_ROOT
        value: /opt/render/project/data/nba_source
      - key: SYNDICATE_NBA_ARTIFACT_ROOT
        value: /opt/render/project/data/nba_source/source_artifacts
      - key: SYNDICATE_NHL_SOURCE_ROOT
        value: /opt/render/project/data/nhl_source
      - key: SYNDICATE_NFL_SOURCE_ROOT
        value: /opt/render/project/data/nfl_source
      - key: SYNDICATE_NCAAF_SOURCE_ROOT
        value: /opt/render/project/data/ncaaf_source
      - key: SYNDICATE_NCAAB_SOURCE_ROOT
        value: /opt/render/project/data/ncaab_source
      - key: SYNDICATE_WNBA_SOURCE_ROOT
        value: /opt/render/project/data/wnba_source
      - key: SYNDICATE_REPORTS_ROOT
        value: /opt/render/project/data/reports
      - key: SYNDICATE_WEB_PUBLISH_URL
        value: https://syndicate-an21.onrender.com
      - key: SYNDICATE_NBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_WNBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_NHL_SOURCE_CLI_GENERATION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "60"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      # DISABLED here. refresh-worker owns the intelligence-state background
      # loop; exactly ONE service may, or two owners would recompute the same
      # state concurrently and reproduce the 2026-07-25 collision on another box.
      #
      # History, because the comment that used to sit here said the opposite and
      # survived the fix (see #70): hosting the board build on THIS service was
      # briefly the plan on 2026-07-25, when refresh-worker was still 2GB and
      # peaked ~1674MB running the MLB sim alone. It was rejected and never
      # shipped -- refresh-worker was upgraded to pro/4GB instead, which fixed
      # the capacity problem at its source.
      #
      # Why it was rejected, and why this must stay "false" even though this box
      # runs neither the sim nor the pipeline: its own odds refresh can spawn
      # WNBA SmartSim in this 2048MB container, and a code comment puts that at
      # ~1.3-1.5GB. That figure is UNVERIFIED -- it is a comment, not a
      # measurement, and 2026-07-25 was an All-Star day with one game (measured
      # 412-652MB), so it proves nothing either way. See #59; do not treat this
      # box as having spare headroom until that measurement exists.
      - key: SYNDICATE_ENABLE_INTELLIGENCE_STATE_BACKGROUND_LOOP
        value: "false"
      - key: SYNDICATE_ENABLE_LIVE_ODDS_REFRESH_LOOP
        value: "true"
      - key: SYNDICATE_BOOTSTRAP_WNBA_TODAY
        value: "1"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_IDLE_INTERVAL_SECONDS
        value: "900"
      # This worker's own container memory was observed climbing from ~416MB
      # to ~989MB over a single session with no repeated expensive call to
      # blame -- ordinary page cache accumulation from routine multi-sport
      # file I/O every tick in a process that never restarts. Force a clean
      # self-exit periodically so Render restarts it fresh and drops the
      # accumulated cache back to baseline instead of climbing toward another
      # OOM kill.
      - key: SYNDICATE_LIVE_ODDS_WORKER_MAX_UPTIME_SECONDS
        value: "21600"
      # Confirmed production incident 2026-07-16: this worker's outer tick
      # loop was sleeping a fixed 60s regardless of phase (a separate bug,
      # also fixed), so every tick relaunched the full predict-date +
      # SmartSim pipeline before the previous cold-start attempt (20-30+ min)
      # could finish -- game_cards_<date>.csv never got produced for WNBA/MLB.
      # This cooldown blocks a pregame relaunch for this long after the last
      # attempt, independent of the interval fix and of
      # _assert_no_active_refresh_run's own PID-based guard. On by default
      # (not a dark launch) since it's a fix for already-broken behavior, not
      # new functionality.
      - key: SYNDICATE_LIVE_ODDS_PREGAME_RELAUNCH_COOLDOWN_SECONDS
        value: "1800"
      - key: SYNDICATE_INTELLIGENCE_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_LIVE_ODDS_REFRESH_PHASE
        value: "live"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_EXECUTION_MODE
        value: "source"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_MODE
        value: "full"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_REGIONS
        value: us
      - key: SYNDICATE_LIVE_ODDS_REFRESH_SKIP_MIRROR
        value: "true"
      # MLB daily sim / look-ahead / evening-next-day sim ownership moved to
      # refresh-worker 2026-07-20 to isolate the 1000-sim Monte Carlo job's
      # memory footprint from this worker's odds-refresh + NBA/WNBA SmartSim
      # + live-lens load (documented OOM history: sim workers cut to 1, WNBA
      # sim count cut 500->250->100, all fighting for the same 2GB). This
      # worker still OBSERVES sim state (via the shared PID-verified pointer
      # in live_refresh_loop.py) to keep gating its own odds-refresh launches
      # around a resident sim -- see sim_process_running in
      # _run_live_refresh_tick -- it just no longer LAUNCHES one itself.
      - key: SYNDICATE_MLB_SIM_TICK_OWNER
        value: "false"
      # #129: reverted back to "true" -- refresh-worker's competing
      # MLB_ENABLE_REFRESH_WORKER_AUTORUN path (set "false" there now) is
      # fully disabled, so this worker is the sole MLB odds-refresh owner
      # again, not just nominally excluded from a race with another owner.
      # See render.yaml's refresh-worker block for the full incident writeup.
      - key: SYNDICATE_MLB_REFRESH_TICK_OWNER
        value: "true"
      # Same ownership-split pattern as MLB above, for nfl/ncaaf/ncaab -- see
      # the matching comment on refresh-worker's WEEKLY_SPORTS_REFRESH_TICK_OWNER
      # (set "true" there). Without this, this worker's own tick and
      # refresh-worker's weekly-sports autorun would both target the same
      # in-season weekly-sport artifacts once football season starts.
      - key: WEEKLY_SPORTS_REFRESH_TICK_OWNER
        value: "false"
      # #148: soccer's pregame steps (schedule/odds/props/picks -- direct
      # OddsAPI calls) need a trigger that doesn't depend on the shared
      # adaptive tick's GLOBAL cross-sport phase (that phase reads "live" the
      # instant ANY sport has a live game, which is most evenings once
      # MLB/WNBA/NBA are running, starving soccer's own pregame cadence
      # window even when soccer itself is due). refresh-worker's own soccer
      # autorun (SYNDICATE_ENABLE_SOCCER_WEEKLY_REFRESH_AUTORUN above) used to
      # cover this gap with phase="all", but that made refresh-worker a
      # second direct OddsAPI caller for soccer -- the same ownership
      # violation fixed for MLB in #139/#144. This is the real fix: an
      # independent, soccer-scoped pregame trigger owned by this worker (the
      # only service that should ever call OddsAPI), while refresh-worker's
      # autorun is now scoped to phase="live" (the sim only).
      - key: SYNDICATE_ENABLE_SOCCER_PREGAME_REFRESH_AUTORUN
        value: "true"
      - key: SYNDICATE_SOCCER_PREGAME_REFRESH_INTERVAL_SECONDS
        value: "14400"
      - key: SYNDICATE_ENABLE_MLB_DAILY_SIM_TRIGGER
        value: "false"
      - key: SYNDICATE_LOOK_AHEAD_ENABLED
        value: "false"
      - key: SYNDICATE_MLB_EVENING_NEXT_DAY_SIM_ENABLED
        value: "false"
      - key: MLB_BETTING_DATA_ROOT
        value: /opt/render/project/data/mlb_source/source_artifacts/data
      - key: MLB_LIVE_LENS_DIR
        value: /opt/render/project/data/mlb_source/source_artifacts/data/live_lens
      - key: NBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/nba_source/data
      - key: NBA_LIVE_LENS_DIR
        value: /opt/render/project/data/nba_source/source_artifacts/data/live_lens
      - key: NHL_DATA_DIR
        value: ./data/nhl_source/source_artifacts/data
      - key: NHL_LIVE_LENS_DIR
        value: ./data/nhl_source/source_artifacts/data/live_lens
      - key: WNBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/wnba_source/data
      - key: WNBA_LIVE_LENS_DIR
        value: /opt/render/project/data/wnba_source/source_artifacts/data/live_lens
      - key: SYNDICATE_WNBA_SOURCE_APP_FALLBACK
        value: "false"
      # 2026-07-19: yesterday's smart-sim engine upgrade (25f34697) raised the
      # default 150 -> 500, benchmarked safe in isolation but not against a
      # busy live session's concurrent MLB sim/refresh memory pressure in the
      # same 2048MB container. This runs in-process (cli_module.cli.main(),
      # not a subprocess -- see refresh_wnba_oddsapi_props.py's
      # _run_source_cli_command), so its possession-level Monte Carlo cost
      # lives entirely inside refresh_wnba_oddsapi_props.py's own RSS. First
      # cut to 250 wasn't enough -- observed the container hit 100%
      # (2048/2048MB) with this process alone at 1.5GB+ RSS, correlating with
      # a live-odds-worker restart, even after that change. --smart-sim-pbp
      # (possession-level mode, stays on) is what produces quarter/interval
      # props, so n_sims -- not disabling pbp -- is the lever that trades
      # memory for prediction precision without losing that feature.
      - key: REFRESH_PREDICT_PROPS_SMART_SIM_N_SIMS
        value: "100"
      - key: MLB_ENABLE_LIVE_LENS_LOOP
        value: "true"
      - key: MLB_ENABLE_LIVE_LENS_BACKGROUND_REPORTS
        # Syndicate's own live_lens_loop.py (SYNDICATE_ENABLE_LIVE_LENS_LOOP
        # below) is now the sole trigger of the expensive
        # _persist_live_lens_report/estimate_live sweep for MLB. This vendor
        # loop's own report-refresh trigger raced it uncoordinated in the same
        # process (see docs/fix_notes_log.md / commit 9307fb80) -- disabling
        # just this flag stops that race while leaving this loop's other job
        # (_warm_cards_api_cache) running untouched.
        value: "false"
      - key: MLB_LIVE_LENS_LOOP_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_LENS_REPORT_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: MLB_LIVE_LENS_REPORT_MAX_AGE_SECONDS
        value: "60"
      - key: MLB_LIVE_ODDSAPI_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: SYNDICATE_ENABLE_LIVE_LENS_LOOP
        value: "true"
      - key: SYNDICATE_LIVE_LENS_INTERVAL_SECONDS
        value: "60"
      # #124: the code default (1800MB) requires total usage stay under
      # ~250MB on this service's 2048MB container -- confirmed live via a
      # temporary diagnostic that MLB's live-lens tick was failing this
      # exact check on ~80% of cycles (2/11, then 3/13 measured), always at
      # the SAME steady-state usage (850-880MB) whether the tick succeeded
      # or failed, meaning the threshold -- not actual memory pressure --
      # was the cause. NBA and WNBA never fail; MLB is the only sport gated
      # by this check at all (_mlb_live_lens_headroom_snapshot). 1000MB still
      # leaves ~170MB of margin above the observed steady baseline before
      # the gate blocks, a real safety margin against genuine OOM risk,
      # without rejecting nearly every cycle the way 1800MB did.
      - key: SYNDICATE_LIVE_LENS_MIN_HEADROOM_MB
        value: "1000"
      # Play-by-play-level smart sim re-enabled: the OOM this originally
      # mitigated was root-caused to the live-odds-worker's fixed 60s tick
      # relaunching the full pipeline before the previous attempt finished
      # (since fixed with adaptive intervals, pregame relaunch cooldown, and
      # periodic worker recycling). PBP mode drives quarter scores from
      # possession simulation and returns real per-minute scoring buckets.
      - key: REFRESH_PREDICT_PROPS_SMART_SIM_PBP
        value: "true"

