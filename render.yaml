      - key: SYNDICATE_ENABLE_MLB_DAILY_SIM_TRIGGER
        value: "false"
      # #163 follow-up: owned by refresh-worker, same as the sim trigger above.
      - key: SYNDICATE_ENABLE_MLB_STATCAST_REFRESH_TRIGGER
