# Keep this file changing when we need to force a fresh Render deploy after data refresh fixes.
# Force redeploy after NHL source_artifacts path fix.
# Force redeploy after MLB source_artifacts path fix.
# Force redeploy after MLB live-lens rebuild fallback.
# Force redeploy after MLB live-lens deployment lag.
# Force redeploy after stalled Render healthz commit.
# Force redeploy after WNBA live game lens interval odds fix.
services:
  - type: web
    name: syndicate
    env: python
    plan: standard
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: if [ "${SYNDICATE_BOOTSTRAP_ON_START:-0}" = "1" ]; then python scripts/bootstrap_data_root.py; fi; gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-3} --threads ${GUNICORN_THREADS:-2} --timeout ${GUNICORN_TIMEOUT:-120} --graceful-timeout ${GUNICORN_GRACEFUL_TIMEOUT:-30} --keep-alive ${GUNICORN_KEEPALIVE:-5}
    healthCheckPath: /healthz
    disk:
      name: syndicate-data
      mountPath: /opt/render/project/data
      sizeGB: 50
    envVars:
      - key: TZ
        value: America/Chicago
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ODDS_API_KEY
        value: 77ae1c35140c82da1675af85dde36a44
      - key: SYNDICATE_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_REFRESH_STATE_BACKEND
        value: keyvalue
      - key: SYNDICATE_DATA_ROOT
        value: /opt/render/project/data
      - key: SYNDICATE_REPORTS_ROOT
        value: /opt/render/project/data/reports
      - key: SYNDICATE_NBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_WNBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_NHL_SOURCE_CLI_GENERATION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "3"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      - key: SYNDICATE_BOOTSTRAP_ON_START
        value: "1"
      - key: MLB_BETTING_DATA_ROOT
        value: /opt/render/project/data/mlb_source/source_artifacts/data
      - key: MLB_LIVE_LENS_DIR
        value: /opt/render/project/data/mlb_source/source_artifacts/data/live_lens
      - key: NBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/nba_source/source_artifacts/data
      - key: NBA_LIVE_LENS_DIR
        value: /opt/render/project/data/nba_source/source_artifacts/data/live_lens
      - key: WNBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/wnba_source/source_artifacts/data
      - key: WNBA_LIVE_LENS_DIR
        value: /opt/render/project/data/wnba_source/source_artifacts/data/live_lens
      - key: NHL_LIVE_LENS_DIR
        value: /opt/render/project/data/nhl_source/source_artifacts/data/live_lens
      - key: NHL_DATA_DIR
        value: /opt/render/project/data/nhl_source/source_artifacts/data
      - key: MLB_ENABLE_LIVE_LENS_LOOP
        value: "true"
      - key: MLB_ENABLE_LIVE_LENS_BACKGROUND_REPORTS
        value: "true"
      - key: MLB_LIVE_LENS_LOOP_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_LENS_REPORT_REFRESH_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_ODDSAPI_REFRESH_INTERVAL_SECONDS
        value: "30"

  - type: cron
    name: syndicate-odds-refresh-live
    runtime: python
    plan: starter
    autoDeploy: true
    schedule: "*/5 * * * *"
    buildCommand: echo "cron build ready"
    startCommand: python scripts/render_cron_enqueue_refresh.py --sports mlb,nba,nhl,nfl,wnba,ncaab,ncaaf --phase live --execution-mode source --regions us --include-mirror --timeout-sec 180
    envVars:
      - key: TZ
        value: America/Chicago
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host
      - key: SYNDICATE_WEB_PORT
        fromService:
          name: syndicate
          type: web
          property: port

  - type: cron
    name: syndicate-odds-refresh-pregame
    runtime: python
    plan: starter
    autoDeploy: true
    schedule: "*/15 * * * *"
    buildCommand: echo "cron build ready"
    startCommand: python scripts/render_cron_enqueue_refresh.py --sports mlb,nba,nhl,nfl,wnba,ncaab,ncaaf --phase pregame --execution-mode source --regions us --include-mirror --timeout-sec 180
    envVars:
      - key: TZ
        value: America/Chicago
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host
      - key: SYNDICATE_WEB_PORT
        fromService:
          name: syndicate
          type: web
          property: port

  - type: cron
    name: syndicate-odds-refresh-daily-prime
    runtime: python
    plan: starter
    autoDeploy: true
    schedule: "20 10 * * *"
    buildCommand: echo "cron build ready"
    startCommand: python scripts/render_cron_enqueue_refresh.py --sports all --phase pregame --execution-mode source --regions us --include-mirror --timeout-sec 180
    envVars:
      - key: TZ
        value: America/Chicago
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host
      - key: SYNDICATE_WEB_PORT
        fromService:
          name: syndicate
          type: web
          property: port