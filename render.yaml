      - key: SYNDICATE_BOOTSTRAP_ON_START
        value: "1"
      - key: SYNDICATE_BOOTSTRAP_WNBA_TODAY
        value: "1"
      - key: SYNDICATE_NBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_WNBA_SOURCE_APP_FALLBACK
        value: "false"
      - key: SYNDICATE_NHL_SOURCE_CLI_GENERATION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "60"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      - key: SYNDICATE_ENABLE_INTELLIGENCE_STATE_BACKGROUND_LOOP
        value: "true"
      - key: SYNDICATE_ENABLE_LIVE_ODDS_REFRESH_LOOP
        value: "false"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_IDLE_INTERVAL_SECONDS
        value: "900"
      - key: SYNDICATE_INTELLIGENCE_REFRESH_INTERVAL_SECONDS
        value: "60"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_LIVE_ODDS_REFRESH_PHASE
        value: "live"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_EXECUTION_MODE
        value: "source"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_MODE
        value: "full"
      - key: SYNDICATE_SERIAL_SPORT_REFRESH
        value: "true"
      - key: SYNDICATE_LIVE_ODDS_REFRESH_REGIONS
        value: us
      - key: SYNDICATE_LIVE_ODDS_REFRESH_SKIP_MIRROR
        value: "true"
      - key: MLB_BETTING_DATA_ROOT
        value: /opt/render/project/data/mlb_source/source_artifacts/data
      - key: MLB_LIVE_LENS_DIR
        value: /opt/render/project/data/mlb_source/source_artifacts/data/live_lens
      - key: NBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/nba_source/data
      - key: NBA_LIVE_LENS_DIR
        value: ./data/nba_source/source_artifacts/data/live_lens
      - key: NHL_DATA_DIR
        value: ./data/nhl_source/source_artifacts/data
      - key: NHL_LIVE_LENS_DIR
        value: ./data/nhl_source/source_artifacts/data/live_lens
      - key: WNBA_BETTING_DATA_ROOT
        value: /opt/render/project/data/wnba_source/data
      - key: WNBA_LIVE_LENS_DIR
        value: ./data/wnba_source/source_artifacts/data/live_lens
      - key: MLB_ENABLE_LIVE_LENS_LOOP
        value: "false"
      - key: MLB_ENABLE_LIVE_LENS_BACKGROUND_REPORTS
        value: "false"
      - key: MLB_LIVE_LENS_LOOP_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_LENS_REPORT_REFRESH_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_ODDSAPI_REFRESH_INTERVAL_SECONDS
        value: "60"
      # Play-by-play-level smart sim re-enabled: the OOM this originally
      # mitigated was root-caused to the live-odds-worker's fixed 60s tick
      # relaunching the full pipeline before the previous attempt finished
      # (since fixed with adaptive intervals, pregame relaunch cooldown, and
      # periodic worker recycling). PBP mode drives quarter scores from
      # possession simulation and returns real per-minute scoring buckets.
      - key: REFRESH_PREDICT_PROPS_SMART_SIM_PBP
        value: "true"

  - type: worker
    name: live-odds-worker
    env: python
    plan: standard
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_live_odds_refresh_worker.py
    disk:
      name: syndicate-data-live-odds-worker
      mountPath: /opt/render/project/data
      sizeGB: 50
    envVars:
      - key: TZ
        value: America/Chicago
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: ODDS_API_KEY
        value: 77ae1c35140c82da1675af85dde36a44
      - key: SYNDICATE_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_WEB_DYNO
        value: "false"
      - key: SYNDICATE_REQUIRE_HOSTED_STORAGE
        value: "true"
      - key: SYNDICATE_REFRESH_STATE_BACKEND
        value: keyvalue
      - key: SYNDICATE_REFRESH_STATE_URL
        fromService:
          name: syndicate-refresh-state
          type: keyvalue
          property: connectionString
