services:
  - type: web
    name: syndicate
    env: python
    plan: standard
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/bootstrap_data_root.py ; gunicorn wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: syndicate-data
      mountPath: /opt/render/project/data
      sizeGB: 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ODDS_API_KEY
        value: 77ae1c35140c82da1675af85dde36a44
      - key: SYNDICATE_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_DATA_ROOT
        value: /opt/render/project/data
      - key: SYNDICATE_REPORTS_ROOT
        value: /opt/render/project/data/reports
      - key: SYNDICATE_MLB_SOURCE_ROOT
        value: /opt/render/project/data/mlb_source
      - key: SYNDICATE_NBA_ARTIFACT_ROOT
        value: /opt/render/project/data/nba_source
      - key: SYNDICATE_NHL_SOURCE_ROOT
        value: /opt/render/project/data/nhl_source
      - key: SYNDICATE_NFL_SOURCE_ROOT
        value: /opt/render/project/data/nfl_source
      - key: SYNDICATE_WNBA_SOURCE_ROOT
        value: /opt/render/project/data/wnba_source
      - key: SYNDICATE_NCAAF_SOURCE_ROOT
        value: /opt/render/project/data/ncaaf_source
      - key: SYNDICATE_NCAAB_SOURCE_ROOT
        value: /opt/render/project/data/ncaab_source

  - type: cron
    name: syndicate-odds-refresh-live
    runtime: python
    plan: starter
    autoDeploy: true
    schedule: "*/5 * * * *"
    buildCommand: echo "cron build ready"
    startCommand: python scripts/render_cron_enqueue_refresh.py --sports mlb,nba,nhl,nfl,wnba,ncaab,ncaaf --phase live --execution-mode source --regions us --timeout-sec 180
    envVars:
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host
      - key: SYNDICATE_WEB_PORT
        fromService:
          name: syndicate
          type: web
          property: port

  - type: cron
    name: syndicate-odds-refresh-pregame
    runtime: python
    plan: starter
    autoDeploy: true
    schedule: "*/15 * * * *"
    buildCommand: echo "cron build ready"
    startCommand: python scripts/render_cron_enqueue_refresh.py --sports mlb,nba,nhl,nfl,wnba,ncaab,ncaaf --phase pregame --execution-mode source --regions us --timeout-sec 180
    envVars:
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host
      - key: SYNDICATE_WEB_PORT
        fromService:
          name: syndicate
          type: web
          property: port

  - type: cron
    name: syndicate-odds-refresh-daily-prime
    runtime: python
    plan: starter
    autoDeploy: true
    schedule: "20 10 * * *"
    buildCommand: echo "cron build ready"
    startCommand: python scripts/render_cron_enqueue_refresh.py --sports all --phase pregame --execution-mode source --regions us --timeout-sec 180
    envVars:
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host
      - key: SYNDICATE_WEB_PORT
        fromService:
          name: syndicate
          type: web
          property: port