services:
  - type: web
    name: syndicate
    env: python
    plan: standard
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application
    healthCheckPath: /
    disk:
      name: syndicate-data
      mountPath: /opt/render/project/src/data
      sizeGB: 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ODDS_API_KEY
        sync: false
      - key: SYNDICATE_REFRESH_LAUNCH_MODE
        value: detached_subprocess
      - key: SYNDICATE_DATA_ROOT
        value: /opt/render/project/src/data
      - key: SYNDICATE_REPORTS_ROOT
        value: /opt/render/project/src/data/reports

  - type: cron
    name: syndicate-odds-refresh-live
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python -c "import json, os, urllib.request; token=os.environ['ADMIN_TOKEN']; host=os.environ['SYNDICATE_WEB_HOST']; payload={'sports':'mlb,nba,nhl,nfl,wnba,ncaab,ncaaf','phase':'live','execution_mode':'source','regions':'us'}; req=urllib.request.Request(f'http://{host}/api/ops/odds-refresh/run?admin_token={token}', data=json.dumps(payload).encode('utf-8'), headers={'Content-Type':'application/json'}); urllib.request.urlopen(req, timeout=180).read()"
    envVars:
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host

  - type: cron
    name: syndicate-odds-refresh-pregame
    runtime: python
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python -c "import json, os, urllib.request; token=os.environ['ADMIN_TOKEN']; host=os.environ['SYNDICATE_WEB_HOST']; payload={'sports':'mlb,nba,nhl,nfl,wnba,ncaab,ncaaf','phase':'pregame','execution_mode':'source','regions':'us'}; req=urllib.request.Request(f'http://{host}/api/ops/odds-refresh/run?admin_token={token}', data=json.dumps(payload).encode('utf-8'), headers={'Content-Type':'application/json'}); urllib.request.urlopen(req, timeout=180).read()"
    envVars:
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host

  - type: cron
    name: syndicate-odds-refresh-daily-prime
    runtime: python
    plan: starter
    schedule: "20 10 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python -c "import json, os, urllib.request; token=os.environ['ADMIN_TOKEN']; host=os.environ['SYNDICATE_WEB_HOST']; payload={'sports':'all','phase':'pregame','execution_mode':'source','regions':'us'}; req=urllib.request.Request(f'http://{host}/api/ops/odds-refresh/run?admin_token={token}', data=json.dumps(payload).encode('utf-8'), headers={'Content-Type':'application/json'}); urllib.request.urlopen(req, timeout=180).read()"
    envVars:
      - key: ADMIN_TOKEN
        fromService:
          name: syndicate
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SYNDICATE_WEB_HOST
        fromService:
          name: syndicate
          type: web
          property: host