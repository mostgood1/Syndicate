<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WNBA Game Cards</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='shared/standalone_shell.css', v=asset_version) }}" />
  <link rel="stylesheet" href="/wnba/styles.css?v={{ asset_version }}" />
  <link rel="stylesheet" href="/wnba/cards-parity.css?v={{ asset_version }}" />
</head>
<body data-cards-base-path="/wnba/cards" class="cards-body cards-app-shell">
  {% with active_sport_slug='wnba', active_sport_name='WNBA' %}
    {% include 'shared/_standalone_app_header.html' %}
  {% endwith %}
  <div class="site-chrome">
    <main class="site-main">
      <div class="cards-shell cards-page-shell">
        <header class="cards-header">
          <div class="cards-title-row">
            <h1>WNBA Game Cards</h1>
            <div class="cards-header-meta" id="cardsHeaderMeta">Loading slate...</div>
          </div>
        </header>

        <section class="cards-control-card" aria-label="Slate controls">
          <form id="controls" class="cards-date-form" onsubmit="return false;">
            <a class="cards-nav-pill" id="cardsPrevDateLink" href="/wnba/cards?date={{ date }}" rel="prev">Prev</a>
            <span class="cards-nav-pill cards-form-pill" aria-hidden="true">Date</span>
            <input type="date" id="datePicker" aria-label="Select slate date" title="Select slate date" />
            <button type="button" id="applyBtn">Load</button>
            <a class="cards-nav-pill" id="cardsNextDateLink" href="/wnba/cards?date={{ date }}" rel="next">Next</a>
            <a class="cards-nav-pill" id="cardsSeasonBettingCardLink" href="{{ '/wnba/season/' ~ date[:4] ~ '/betting-card?profile=retuned&date=' ~ date }}">Betting Card</a>
            <a class="cards-nav-pill" href="/wnba/props?date={{ date }}">Props</a>
            <a class="cards-nav-pill" href="/wnba/live-player-props-audit?date={{ date }}">Live Prop Audit</a>
            <a class="cards-nav-pill" href="/wnba/archive?date={{ date }}">Daily Archive</a>
            <a class="cards-nav-pill" href="/wnba/hub">WNBA Hub</a>
          </form>

          <div class="cards-toolbar-rail">
            <div class="cards-source-meta" id="cardsSourceMeta">Loading slate...</div>
            <div class="cards-filters" id="cardsFilters" aria-label="Slate filters"></div>
          </div>
        </section>

        <div id="note" class="alert hidden"></div>

        <section class="cards-scoreboard" id="cardsScoreboard" aria-label="Games">
          <div class="cards-loading-strip">Loading scoreboard...</div>
        </section>

        <main class="cards-grid" id="cardsGrid" aria-live="polite">
          <div class="cards-loading-state">Loading cards...</div>
        </main>
      </div>
    </main>
  </div>

  <script src="/wnba/cards-parity.js?v={{ asset_version }}"></script>
</body>
</html>
