<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MLB Betting - Market Accuracy</title>
  <meta name="description" content="Daily pregame market accuracy for MLB betting-card recommendations." />
  <link rel="icon" href="data:,">
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{--bg:#080d1a;--card:#0d1426;--card2:#121b31;--text:#f5f7ff;--muted:#c3cee4;--border:#243356;--link:#b8d1ff;--pill-bg:#101a2e;--pill-br:#2a3a63}
    body.light{--bg:#ffffff;--card:#f8fafc;--card2:#f1f5fb;--text:#0a1020;--muted:#475569;--border:#cbd5e1;--link:#1e3a8a;--pill-bg:#eef3fb;--pill-br:#94a3b8}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}
    .container{max-width:1100px;margin:24px auto;padding:0 16px}
    a{color:var(--link)} h1{margin:0 0 12px;font-size:26px}
    .nav{font-size:14px;margin-bottom:10px} .nav a{color:var(--link);text-decoration:none;margin-right:10px}
    .nav button.theme-toggle{background:var(--pill-bg);color:var(--text);border:1px solid var(--pill-br);border-radius:6px;padding:6px 10px;cursor:pointer}
    .cards-summary{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;align-items:stretch}
    .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
    .card-summary{flex:1;min-width:240px;padding:10px;background:linear-gradient(180deg,#132a52,#0d1426)}
    .title-sm{font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
    .title-lg{font-size:20px;font-weight:600} .title-md{font-size:18px;font-weight:600}
    .muted-small{font-size:12px;color:var(--muted)}
    table{width:100%;border-collapse:collapse} th,td{padding:8px} thead th{text-align:left;border-bottom:1px solid var(--border)} tbody tr{border-top:1px solid var(--border)}
    .table-wrap{overflow-x:auto}
    .day-good{border-color:#2e8b57}
    .day-bad{border-color:#8b2e2e}
    .day-net{font-weight:600}
    .day-net.good{color:#9ae6b4}
    .day-net.bad{color:#fca5a5}
    form.filters{margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    form.filters input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px}
    form.filters select,.table-filters select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px}
    form.filters button{background:var(--pill-bg);color:var(--text);border:1px solid var(--pill-br);border-radius:6px;padding:6px 10px;text-decoration:none;font-size:13px;cursor:pointer}
    .mt-1{margin-top:1rem} .mt-4{margin-top:4px}
    details > summary{cursor:pointer}
    ul.warning-list{margin:8px 0 0 18px;padding:0}
    .preset-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
    .preset-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    .preset-btn{background:var(--pill-bg);color:var(--text);border:1px solid var(--pill-br);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
    .window-action-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
    .window-action-bar[hidden]{display:none}
    .window-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0}
    .window-status[hidden]{display:none}
    .day-quick-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
    .day-chip{background:var(--pill-bg);color:var(--text);border:1px solid var(--pill-br);border-radius:999px;padding:5px 10px;font-size:12px}
    .table-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
    .table-filters input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;min-width:180px}
    .table-meta{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .table-count{font-size:12px;color:var(--muted)}
    @media (max-width:760px){ .container{padding:0 10px;margin:12px auto} h1{font-size:20px;margin-bottom:6px} .nav{font-size:12px;overflow-x:auto;white-space:nowrap;padding-bottom:4px} .nav a{display:inline-block;margin-right:6px} table{font-size:12px} th,td{padding:6px 4px} thead th{font-size:11px} form.filters input{padding:4px 6px;font-size:12px} form.filters button{padding:4px 8px;font-size:12px} }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="{{ back_href }}">{{ back_label }}</a> |
      <a href="{{ live_lens_href }}">Live Lens</a> |
      <a href="{{ daily_accuracy_href }}">Live Lens Daily Accuracy</a> |
      <a href="{{ self_href }}" aria-current="page">Market Accuracy</a> |
      <button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark">Toggle Theme</button>
    </div>
    <h1>MLB Betting - Market Accuracy</h1>
    <form class="filters" id="filters" onsubmit="event.preventDefault(); loadAll();">
      <label>Date: <input type="date" id="datePicker" /></label>
      <button type="submit">Apply</button>
      <button type="button" id="resetBtn">Reset</button>
    </form>

    <div class="muted-small" id="windowBanner">Last 30 days</div>
    <div id="summaryRoot" class="cards-summary"></div>
  <div id="windowActionBar" class="window-action-bar" hidden></div>
    <div id="windowStatusBar" class="window-status" hidden></div>

    <h2 class="mt-1">Daily Recaps</h2>
    <div class="muted-small">Pregame recommendation accuracy from mirrored season betting-day payloads.</div>
    <div id="dailyRoot" class="cards-summary"></div>
  </div>

  <script>
    window.addEventListener('error', function(ev){try{const root=document.getElementById('dailyRoot')||document.getElementById('summaryRoot');if(root){const msg=(ev&&ev.error&&ev.error.message)?ev.error.message:(ev&&ev.message?ev.message:'Unknown error');root.innerHTML=`<div class="card">An error occurred while rendering: ${String(msg)}</div>`;}}catch(_){}});
    (function(){try{const body=document.body;const saved=localStorage.getItem('theme');if(saved==='light') body.classList.add('light');const t=document.getElementById('themeToggle');if(t){t.addEventListener('click',()=>{body.classList.toggle('light');localStorage.setItem('theme', body.classList.contains('light')?'light':'dark');});}}catch(_){}})();
    function localYMD(){const tz='America/New_York';const cutoffHour=6;try{const now=new Date();const hourStr=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',hour12:false}).format(now);const hour=Number(hourStr);const base=(Number.isFinite(hour)&&hour<cutoffHour)?new Date(now.getTime()-24*60*60*1000):now;return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(base);}catch(_){const d=new Date();const base=(d.getHours()<cutoffHour)?new Date(d.getTime()-24*60*60*1000):d;const y=base.getFullYear();const m=String(base.getMonth()+1).padStart(2,'0');const day=String(base.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}}
    function esc(s){const str=String(s==null?'':s);return str.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));}
    function fmtPct(x){try{if(x==null) return '—';const v=Number(x);return Number.isFinite(v)?(v.toFixed(1)+'%'):'—';}catch(_){return '—';}}
    function fmtMoneyUnits(u){try{if(u==null) return '—';const v=Number(u)*100;if(!Number.isFinite(v)) return '—';const sign=v>=0?'':'-';return sign+'$'+Math.abs(v).toFixed(0);}catch(_){return '—';}}
    function fmtNum(x){try{if(x==null || x==='') return '—';const v=Number(x);return Number.isFinite(v)?String(v):String(x);}catch(_){return '—';}}
    function isoTodayUTC(){try{return new Date().toISOString().slice(0,10);}catch(_){return '';}}
    function addDaysUTC(iso, days){try{const d=new Date(String(iso).slice(0,10)+'T00:00:00Z');if(Number.isFinite(Number(days))) d.setUTCDate(d.getUTCDate()+Number(days));return d.toISOString().slice(0,10);}catch(_){return iso;}}
    function pickYmdFromQuery(){try{return new URL(window.location.href).searchParams.get('date');}catch(_){return null;}}
    function updateUrlDate(d){try{const u=new URL(window.location.href);u.searchParams.set('date',d);window.history.replaceState({},'',u.toString());}catch(_){} }
    function slugify(s){return String(s||'section').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'section';}
    function bucketLine(b){if(!b) return '—';const w=Number(b.wins||0),l=Number(b.losses||0),p=Number(b.pushes||0);const res=Number(b.resolved||0);const acc=(b.accuracy_pct!=null)?fmtPct(Number(b.accuracy_pct)):'—';const roi=(b.roi_pct!=null)?fmtPct(Number(b.roi_pct)):'—';const pl=(b.profit_total!=null)?fmtMoneyUnits(b.profit_total):'—';return `${w}-${l}${p?('-'+p+'P'):''} (${acc}) · ROI ${roi} · P/L ${pl} · ${res} settled`;}
    function renderByMarketTable(byMarket,title){const keys=byMarket&&typeof byMarket==='object'?Object.keys(byMarket):[];if(!keys.length) return '';const rows=keys.sort((a,b)=>String(a).localeCompare(String(b))).map((k)=>{const b=byMarket[k]||{};const n=Number(b.bets||b.total||0);const res=Number(b.resolved||0);const w=Number(b.wins||0),l=Number(b.losses||0),p=Number(b.pushes||0);const acc=(b.accuracy_pct!=null)?fmtPct(Number(b.accuracy_pct)):'—';const roi=(b.roi_pct!=null)?fmtPct(Number(b.roi_pct)):'—';const pl=(b.profit_total!=null)?fmtMoneyUnits(b.profit_total):'—';return `<tr><td>${esc(k)}</td><td>${n}</td><td>${res}</td><td>${w}-${l}${p?('-'+p):''}</td><td>${acc}</td><td>${roi}</td><td>${pl}</td></tr>`;}).join('');return `<div class="mt-4"><div class="title-sm">${esc(title)}</div><div class="table-wrap"><table><thead><tr><th>Market</th><th>Picks</th><th>Settled</th><th>W-L-P</th><th>Acc</th><th>ROI</th><th>P/L</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}
    function renderWarnings(items){const rows=Array.isArray(items)?items.filter(Boolean):[];if(!rows.length) return '';return `<div class="mt-4"><div class="title-sm">Warnings</div><ul class="warning-list">${rows.map((item)=>`<li>${esc(item)}</li>`).join('')}</ul></div>`;}
    function applyRowFilters(tableId){const root=document.getElementById(tableId);if(!root) return;const searchEl=root.querySelector('[data-role="row-search"]');const marketEl=root.querySelector('[data-role="row-market"]');const resultEl=root.querySelector('[data-role="row-result"]');const countEl=root.querySelector('[data-role="row-count"]');const q=String(searchEl&&searchEl.value||'').trim().toLowerCase();const market=String(marketEl&&marketEl.value||'').trim().toLowerCase();const result=String(resultEl&&resultEl.value||'').trim().toLowerCase();let shown=0;const rows=root.querySelectorAll('tbody tr[data-market-row="1"]');rows.forEach((row)=>{const hay=String(row.getAttribute('data-search')||'').toLowerCase();const rowMarket=String(row.getAttribute('data-market')||'').toLowerCase();const rowResult=String(row.getAttribute('data-result')||'').toLowerCase();const visible=(!q||hay.includes(q))&&(!market||rowMarket===market)&&(!result||rowResult===result);row.style.display=visible?'':'none';if(visible) shown+=1;});if(countEl) countEl.textContent=`Showing ${shown} of ${rows.length}`;}
    function renderWindowStatus(label){const root=document.getElementById('windowStatusBar');if(!root) return;if(!label){root.hidden=true;root.innerHTML='';return;}root.hidden=false;root.innerHTML=`<span class="preset-label">Active filter</span><span class="day-chip">${esc(label)}</span><button type="button" class="preset-btn" onclick="resetWindowPreset()">Clear filter</button>`;}
    function setPreset(tableId, preset, label){const root=document.getElementById(tableId);if(!root) return;const searchEl=root.querySelector('[data-role="row-search"]');const marketEl=root.querySelector('[data-role="row-market"]');const resultEl=root.querySelector('[data-role="row-result"]');const detailsEl=root.closest('details');if(detailsEl && !detailsEl.open) detailsEl.open=true;if(searchEl) searchEl.value='';if(marketEl) marketEl.value='';if(resultEl) resultEl.value='';if(preset==='wins' && resultEl) resultEl.value='win';if(preset==='losses' && resultEl) resultEl.value='loss';if(preset==='moneyline' && marketEl) marketEl.value='ml';if(preset==='pitcher_props' && marketEl) marketEl.value='pitcher_props';applyRowFilters(tableId);if(label) renderWindowStatus(label);}
    function resetWindowPreset(){const roots=document.querySelectorAll('[data-table-scope="official"]');roots.forEach((root)=>{const tableId=String(root.id||'').trim();if(!tableId) return;const searchEl=root.querySelector('[data-role="row-search"]');const marketEl=root.querySelector('[data-role="row-market"]');const resultEl=root.querySelector('[data-role="row-result"]');if(searchEl) searchEl.value='';if(marketEl) marketEl.value='';if(resultEl) resultEl.value='';applyRowFilters(tableId);});renderWindowStatus('');}
    function setWindowPreset(preset){const roots=document.querySelectorAll('[data-table-scope="official"]');if(!roots.length) return;const label=(preset==='wins'?'Official wins':(preset==='losses'?'Official losses':(preset==='moneyline'?'Moneyline only':'Official filter')));roots.forEach((root)=>{const tableId=String(root.id||'').trim();if(tableId) setPreset(tableId,preset,label);});renderWindowStatus(label);try{const dailyRoot=document.getElementById('dailyRoot');if(dailyRoot) dailyRoot.scrollIntoView({behavior:'smooth',block:'start'});}catch(_){}}
    function renderRowsTable(rows, title, opts){const items=Array.isArray(rows)?rows:[];if(!items.length) return '';const options=opts&&typeof opts==='object'?opts:{};const tableId=`rows-${slugify(title)}${options.idSuffix?('-'+slugify(options.idSuffix)):''}`;const tableScope=String(options.scope||'').trim();const markets=[...new Set(items.map((row)=>String(row.market||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const results=[...new Set(items.map((row)=>String(row.result||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const presets=Array.isArray(options.presets)?options.presets:[];const presetMarkup=presets.length?`<div class="preset-row"><span class="preset-label">Quick filters</span>${presets.map((preset)=>'<button type="button" class="preset-btn" onclick="setPreset(\''+esc(tableId)+'\',\''+esc(preset.value)+'\')">'+esc(preset.label)+'</button>').join('')}</div>`:'';const body=items.map((row)=>{const search=[row.title,row.matchup,row.market,row.selection,row.result,row.player_name,row.team].filter(Boolean).join(' ');return `<tr data-market-row="1" data-search="${esc(search)}" data-market="${esc(String(row.market||''))}" data-result="${esc(String(row.result||''))}"><td>${esc(row.title||'')}</td><td>${esc(row.matchup||'')}</td><td>${esc(row.market||'')}</td><td>${esc(row.selection||'')}</td><td>${esc(fmtNum(row.line))}</td><td>${esc(fmtNum(row.actual))}</td><td>${esc(row.odds||'—')}</td><td>${esc(fmtMoneyUnits(row.profit_u))}</td><td>${esc((row.result||'').toUpperCase()||'—')}</td></tr>`;}).join('');const openAttr=options.open===false?'':' open';const scopeAttr=tableScope?` data-table-scope="${esc(tableScope)}"`:'';return `<details class="mt-4"${openAttr}><summary><span class="title-sm">${esc(title)}</span> <span class="muted-small">· ${items.length} rows</span></summary><div id="${esc(tableId)}"${scopeAttr}>${presetMarkup}<div class="table-meta mt-4"><div class="table-filters"><input type="search" placeholder="Search picks, players, games" data-role="row-search" oninput="applyRowFilters('${esc(tableId)}')" /><select data-role="row-market" onchange="applyRowFilters('${esc(tableId)}')"><option value="">All markets</option>${markets.map((market)=>`<option value="${esc(market)}">${esc(market)}</option>`).join('')}</select><select data-role="row-result" onchange="applyRowFilters('${esc(tableId)}')"><option value="">All results</option>${results.map((value)=>`<option value="${esc(value)}">${esc(value.toUpperCase())}</option>`).join('')}</select></div><div class="table-count" data-role="row-count">Showing ${items.length} of ${items.length}</div></div><div class="table-wrap"><table><thead><tr><th>Pick</th><th>Game</th><th>Market</th><th>Side</th><th>Line</th><th>Actual</th><th>Odds</th><th>P/L</th><th>Result</th></tr></thead><tbody>${body}</tbody></table></div></div></details>`;}
    function renderSummaryCards(js){const root=document.getElementById('summaryRoot');if(!root) return;root.innerHTML='';const win=js&&js.window?js.window:null;const since=win&&win.since?String(win.since):'';const until=win&&win.until?String(win.until):'';const title=`${since} → ${until}`;const combined=js&&js.summary&&js.summary.combined&&js.summary.combined.overall?js.summary.combined.overall:null;const games=js&&js.summary&&js.summary.games&&js.summary.games.overall?js.summary.games.overall:null;const props=js&&js.summary&&js.summary.props&&js.summary.props.overall?js.summary.props.overall:null;const head=document.createElement('div');head.className='card card-summary';head.innerHTML=`<div class="title-sm">Last 30 days</div><div class="title-lg">Market Accuracy</div><div class="muted-small">${esc(title)}</div>`;root.appendChild(head);function addCard(label,b){const c=document.createElement('div');c.className='card card-summary';c.innerHTML=`<div class="title-sm">${esc(label)}</div><div class="mt-4 title-md">${esc(bucketLine(b))}</div>`;root.appendChild(c);} addCard('Combined',combined); addCard('Games',games); addCard('Props',props); try{const banner=document.getElementById('windowBanner');if(banner) banner.textContent=`Last 30 days (${since} → ${until})`;}catch(_){}}
    function renderWindowActions(js){const root=document.getElementById('windowActionBar');if(!root) return;const days=js&&Array.isArray(js.days)?js.days:[];let officialTotal=0;let officialWins=0;let officialLosses=0;let officialMoneyline=0;days.forEach((day)=>{const rows=((day||{}).rows||{}).official;if(!Array.isArray(rows)) return;officialTotal += rows.length;rows.forEach((row)=>{const result=String((row||{}).result||'').toLowerCase();const market=String((row||{}).market||'').toLowerCase();if(result==='win') officialWins += 1; if(result==='loss') officialLosses += 1; if(market==='ml') officialMoneyline += 1;});});if(!officialTotal){root.hidden=true;root.innerHTML='';return;}root.hidden=false;root.innerHTML=`<span class="preset-label">Window actions</span><span class="day-chip">${officialTotal} official rows</span><button type="button" class="preset-btn" onclick="setWindowPreset('wins')">Official wins ${officialWins}</button><button type="button" class="preset-btn" onclick="setWindowPreset('losses')">Official losses ${officialLosses}</button><button type="button" class="preset-btn" onclick="setWindowPreset('moneyline')">Moneyline only ${officialMoneyline}</button>`;}
    function renderDailyRecaps(js){const root=document.getElementById('dailyRoot');if(!root) return;const days=js&&Array.isArray(js.days)?js.days.slice():[];if(!days.length){root.innerHTML='<div class="card">No market accuracy payloads were available for the selected window.</div>';return;}days.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));root.innerHTML='';days.forEach((it)=>{const date=String(it&&it.date||'');const g=it&&it.games?it.games:{};const p=it&&it.props?it.props:{};const comb=it&&it.combined&&it.combined.overall?it.combined.overall:null;const rowSets=it&&it.rows?it.rows:{};const officialRows=Array.isArray(rowSets.official)?rowSets.official:[];const playableRows=Array.isArray(rowSets.playable)?rowSets.playable:[];const allRows=Array.isArray(rowSets.all)?rowSets.all:[];const officialTableId=`rows-${slugify('Official settled picks')}-${slugify(date)}`;const officialWins=officialRows.filter((row)=>String((row||{}).result||'').toLowerCase()==='win').length;const officialLosses=officialRows.filter((row)=>String((row||{}).result||'').toLowerCase()==='loss').length;const dayNet=(comb&&comb.profit_total!=null&&Number.isFinite(Number(comb.profit_total)))?Number(comb.profit_total):null;const dayClass=(dayNet==null)?'':(dayNet>0?'day-good':(dayNet<0?'day-bad':''));const dayNetTxt=(dayNet==null)?'':(()=>{const css=dayNet>0?'good':(dayNet<0?'bad':'');return ` <span class="day-net ${css}">Net ${fmtMoneyUnits(dayNet)}</span>`;})();const gOver=g&&g.overall?g.overall:null;const pOver=p&&p.overall?p.overall:null;const gLine=g&&g.available?(gOver?('Games: '+bucketLine(gOver)):'Games: pending'):'Games: —';const pLine=p&&p.available?(pOver?('Props: '+bucketLine(pOver)):'Props: pending'):'Props: —';const gTbl=renderByMarketTable(g&&g.by_market?g.by_market:null,'Games by market');const pTbl=renderByMarketTable(p&&p.by_market?p.by_market:null,'Props by market');const warnings=renderWarnings(it&&it.warnings?it.warnings:[]);const officialBar=`<div class="day-quick-bar"><span class="preset-label">Official summary</span><span class="day-chip">${officialRows.length} official</span><button type="button" class="preset-btn" onclick="setPreset('${esc(officialTableId)}','wins')">${officialWins} wins</button><button type="button" class="preset-btn" onclick="setPreset('${esc(officialTableId)}','losses')">${officialLosses} losses</button></div>`;const officialTbl=renderRowsTable(officialRows,'Official settled picks',{open:true,idSuffix:date,scope:'official',presets:[{label:'All',value:'all'},{label:'Wins',value:'wins'},{label:'Losses',value:'losses'},{label:'Moneyline',value:'moneyline'}]});const playableTbl=renderRowsTable(playableRows,'Playable settled picks',{open:false,idSuffix:date,presets:[{label:'All',value:'all'},{label:'Wins',value:'wins'},{label:'Losses',value:'losses'},{label:'Pitcher Props',value:'pitcher_props'}]});const allTbl=renderRowsTable(allRows,'All settled picks',{open:false,idSuffix:date,presets:[{label:'All',value:'all'},{label:'Wins',value:'wins'},{label:'Losses',value:'losses'}]});const card=document.createElement('div');card.className=`card ${dayClass}`;card.innerHTML=`<details><summary><span class="title-md">${esc(date)}</span>${dayNetTxt} <span class="muted-small">· ${esc(gLine)} · ${esc(pLine)} · ${esc(String(officialRows.length))} official rows</span></summary><div class="mt-4"><div class="title-sm">Combined</div><div class="muted-small">${comb?esc(bucketLine(comb)):'—'}</div></div>${officialBar}<div class="mt-4"><div class="title-sm">Games</div><div class="muted-small">${g&&g.available?'Available':'No stored game recommendations'}</div><div class="muted-small mt-4">${gOver?esc(bucketLine(gOver)):'—'}</div>${gTbl}</div><div class="mt-4"><div class="title-sm">Props</div><div class="muted-small">${p&&p.available?'Available':'No stored prop recommendations'}</div><div class="muted-small mt-4">${pOver?esc(bucketLine(pOver)):'—'}</div>${pTbl}</div>${officialTbl}${playableTbl}${allTbl}${warnings}</details>`;root.appendChild(card);});}
    async function loadAll(){const summaryRoot=document.getElementById('summaryRoot');const dailyRoot=document.getElementById('dailyRoot');const actionRoot=document.getElementById('windowActionBar');const statusRoot=document.getElementById('windowStatusBar');if(summaryRoot) summaryRoot.innerHTML='<div class="card">Loading…</div>';if(dailyRoot) dailyRoot.innerHTML='<div class="card">Loading daily recaps…</div>';if(actionRoot){actionRoot.hidden=true;actionRoot.innerHTML='';}if(statusRoot){statusRoot.hidden=true;statusRoot.innerHTML='';}const WINDOW_DAYS=30;const datePicker=document.getElementById('datePicker');const until=(datePicker&&String(datePicker.value||'').trim())?String(datePicker.value||'').trim():isoTodayUTC();const since=addDaysUTC(until,-(WINDOW_DAYS-1));try{updateUrlDate(until);const res=await fetch(`{{ api_path }}?since=${encodeURIComponent(since)}&until=${encodeURIComponent(until)}`, {cache:'no-store'});const js=await res.json();if(!js||js.ok!==true){const msg=js&&js.error?String(js.error):'Failed to load market accuracy.';if(summaryRoot) summaryRoot.innerHTML=`<div class="card">${esc(msg)}</div>`;if(dailyRoot) dailyRoot.innerHTML=`<div class="card">${esc(msg)}</div>`;return;}renderSummaryCards(js);renderWindowActions(js);renderWindowStatus('');renderDailyRecaps(js);}catch(e){const msg=(e&&e.message)?e.message:String(e||'Failed');if(summaryRoot) summaryRoot.innerHTML=`<div class="card">Failed to load: ${esc(msg)}</div>`;if(dailyRoot) dailyRoot.innerHTML=`<div class="card">Failed to load: ${esc(msg)}</div>`;}}
