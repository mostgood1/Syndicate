{% extends "shared/base.html" %}

{% block title %}Syndicate | Intelligence{% endblock %}
{% block page_title %}Intelligence{% endblock %}

{% block content %}
<section style="max-width:1200px; margin:auto; margin-bottom:20px;">
  <div id="intelligence-refresh-status" style="margin-bottom:10px;"></div>
  <div id="intelligence-board-summary" style="margin-bottom:10px;"></div>
  <div id="top-opportunities"></div>
</section>

<section style="
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns: 320px 1fr;
  gap:20px;
">

  <!-- LEFT COLUMN -->
  <div>

    <div id="portfolio"></div>

    <div style="margin-top:20px;">
      <h3>Parlays</h3>
      <div id="parlays"></div>
    </div>

  </div>

  <!-- RIGHT COLUMN -->
  <div>

    <div id="scanner"></div>

    <div id="picks"></div>

  </div>

</section>
{% endblock %}

{% block extra_scripts %}
<script>
let lastVersion = null;
let warmKickoffInFlight = false;
let loadIntelligenceScheduled = false;
let lastResponseTimestamp = null;
let hasRenderedIntelligence = false;
let currentIntelligenceRequest = null;

function refreshStatusElement() {
  return document.getElementById("intelligence-refresh-status");
}

function setRefreshStatus(message, tone = "idle") {
  const element = refreshStatusElement();
  if (!element) {
    return;
  }
  const styles = {
    idle: { background: "rgba(255,255,255,.06)", border: "rgba(255,255,255,.12)", color: "#e5e7eb" },
    loading: { background: "rgba(59,130,246,.14)", border: "rgba(59,130,246,.28)", color: "#dbeafe" },
    refreshing: { background: "rgba(168,85,247,.14)", border: "rgba(168,85,247,.28)", color: "#efe0ff" },
    error: { background: "rgba(239,68,68,.14)", border: "rgba(239,68,68,.28)", color: "#ffd4d4" },
  };
  const style = styles[tone] || styles.idle;
  element.innerHTML = `
    <span style="display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; background:${style.background}; color:${style.color}; border:1px solid ${style.border}; font-size:11px; font-weight:600; letter-spacing:.02em;">
      <span style="width:7px; height:7px; border-radius:999px; background:${style.color}; display:inline-block;"></span>
      ${message}
    </span>
  `;
}

function numericValue(value) {
  return typeof value === "number" && Number.isFinite(value) ? value : null;
}

function displayTitle(item) {
  return String(item.display_name || item.player_name || item.name || item.subject_key || item.pick || item.selection || item.market || "—").trim();
}

function escapeHtml(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[char] || char));
}

function syndicateQuestionForItem(item) {
  const title = displayTitle(item);
  const context = displayContext(item);
  if (title && title !== "—") {
    return context ? `What do you think about ${title} (${context})?` : `What do you think about ${title}?`;
  }
  if (context) {
    return `What do you think about ${context}?`;
  }
  return "What do you think about this pick?";
}

function syndicateContextForItem(item) {
  return {
    sport: String(item && (item.sport_slug || item.sport) || "").trim(),
    sport_slug: String(item && (item.sport_slug || item.sport) || "").trim(),
    market: String(item && (item.market || item.market_key || item.market_label) || "").trim(),
    candidate_type: String(item && item.candidate_type || "").trim(),
    selection: String(item && (item.selection || item.pick) || "").trim(),
    matchup: String(item && item.matchup || "").trim(),
    player_name: String(item && (item.player_name || item.name) || "").trim(),
    name: String(item && (item.display_name || item.name) || "").trim(),
  };
}

function openSyndicateFromItem(item) {
  const question = syndicateQuestionForItem(item);
  const url = `/syndicate?question=${encodeURIComponent(question)}`;
  window.location.assign(url);
}

function displayContext(item) {
  const parts = [];
  const matchup = String(item.matchup || "").trim();
  const candidateType = String(item.candidate_type || "").trim();
  const market = String(item.market || "").trim();
  if (matchup) {
    parts.push(matchup);
  }
  if (candidateType) {
    parts.push(candidateType.toUpperCase());
  } else if (market) {
    parts.push(market);
  }
  return parts.join(" · ");
}

function formatTimestamp(value) {
  const raw = String(value || "").trim();
  if (!raw || raw === "-" || raw === "—" || raw.toLowerCase() === "unknown") {
    return "";
  }
  const date = new Date(raw);
  if (Number.isNaN(date.getTime())) {
    return raw;
  }
  return new Intl.DateTimeFormat(undefined, {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  }).format(date);
}

function displayUpdatedAt(item) {
  return formatTimestamp(
    item.last_updated_timestamp ||
    item.last_updated_at ||
    item.updated_at ||
    item.timestamp ||
    item.generated_at ||
    item.created_at
  );
}

function renderUpdatedLine(item) {
  const updatedAt = displayUpdatedAt(item) || formatTimestamp(lastResponseTimestamp);
  return updatedAt
    ? `<div style="font-size:11px; opacity:.62; margin-top:6px;">Updated ${updatedAt}</div>`
    : "";
}

function displayTeam(item) {
  return String(item.team || item.team_name || item.player_team || "—").trim() || "—";
}

function displayMatchup(item) {
  return String(item.matchup || item.event_matchup || "—").trim() || "—";
}

function displayLine(item) {
  const line = item.line ?? item.market_data?.current_line ?? item.market_context?.current_line;
  const text = String(line ?? "").trim();
  return text || "—";
}

function displayOdds(item) {
  const odds = item.odds ?? item.odds_current ?? item.market_context?.american_odds;
  if (odds === null || odds === undefined || odds === "") {
    return "—";
  }
  const numeric = Number(odds);
  if (Number.isFinite(numeric)) {
    return numeric > 0 ? `+${numeric}` : `${numeric}`;
  }
  return String(odds).trim() || "—";
}

function displayActualProp(item) {
  const selection = String(item.selection || item.pick || "").trim();
  const line = displayLine(item);
  const market = String(item.market || item.market_key || "").trim();
  if (selection) {
    const pieces = [selection];
    if (line && line !== "—") {
      pieces.push(line);
    }
    if (market && market.toLowerCase() !== selection.toLowerCase()) {
      pieces.push(market.replace(/_/g, " "));
    }
    return pieces.join(" ").trim();
  }
  return String(
    item.detail ||
    item.writeup ||
    item.summary ||
    item.surface_title ||
    item.surface ||
    item.market ||
    "—"
  ).trim() || "—";
}

function formatSettlementValue(value) {
  if (value === null || value === undefined || value === "") {
    return "—";
  }
  const numeric = Number(value);
  if (Number.isFinite(numeric)) {
    return Number.isInteger(numeric) ? `${numeric}` : numeric.toFixed(1);
  }
  return String(value).trim() || "—";
}

function displayActualValue(item) {
  const settlement = item.settlement && typeof item.settlement === "object" ? item.settlement : {};
  return formatSettlementValue(
    settlement.actual ??
    item.actual ??
    item.actual_value ??
    item.actual_so_far ??
    item.current_actual ??
    item.live_actual
  );
}

function displayLiveProjection(item) {
  const projection = item.live_projection ?? item.live_total ?? item.projected_live ?? item.projected;
  if (projection === null || projection === undefined || projection === "") {
    return "—";
  }
  const numeric = Number(projection);
  if (Number.isFinite(numeric)) {
    return Number.isInteger(numeric) ? `${numeric}` : numeric.toFixed(1);
  }
  return String(projection).trim() || "—";
}

function displayMovementSummary(item) {
  const movement = item.movement && typeof item.movement === "object" ? item.movement : {};
  const pieces = [];
  const trend = String(movement.trend || item.movement_trend || item.odds_trend || "").trim();
  const deltaDisplay = String(movement.delta_display || item.movement_delta_display || item.edge_delta_display || "").trim();
  const history = Array.isArray(item.movement_history) ? item.movement_history : (Array.isArray(item.market_data?.movement_history) ? item.market_data.movement_history : []);
  const oddsNow = displayOdds(item);
  const oddsOpen = item.odds_open ?? item.market_context?.opening_odds ?? item.market_context?.odds_open;
  const lineOpen = item.line_open ?? item.market_context?.opening_line ?? item.market_context?.line_open;

  if (trend) {
    pieces.push(trend);
  }
  if (deltaDisplay) {
    pieces.push(deltaDisplay);
  }
  if (oddsOpen !== null && oddsOpen !== undefined && oddsOpen !== "" && oddsNow !== "—") {
    const openText = displayOdds({ odds: oddsOpen });
    if (openText !== oddsNow) {
      pieces.push(`Odds ${openText} → ${oddsNow}`);
    }
  }
  if (lineOpen !== null && lineOpen !== undefined && lineOpen !== "") {
    const openText = displayLine({ line: lineOpen, market_data: {}, market_context: {} });
    const currentLine = displayLine(item);
    if (openText !== "—" && currentLine !== "—" && openText !== currentLine) {
      pieces.push(`Line ${openText} → ${currentLine}`);
    }
  }
  if (history.length) {
    pieces.push(`${history.length} moves tracked`);
  }
  if (oddsNow !== "—") {
    pieces.push(`Odds ${oddsNow}`);
  }

  return pieces.length ? pieces.join(" · ") : "—";
}

function displayActualText(item) {
  const actual = displayActualValue(item);
  if (actual !== "—" && actual !== "-") {
    return actual;
  }
  const state = recommendationState(item);
  if (state === "live" || state === "stale") {
    return "live data unavailable";
  }
  if (state === "final") {
    return "settled without current count";
  }
  return "—";
}

function displaySettlementSummary(item) {
  const settlement = item.settlement && typeof item.settlement === "object" ? item.settlement : {};
  const status = String(
    settlement.status ||
    item.settlement_status ||
    item.outcome_state ||
    ""
  ).trim().toLowerCase();
  const statusLabel = String(settlement.status_label || "").trim() || (status ? status.charAt(0).toUpperCase() + status.slice(1) : "");
  const actual = displayActualValue(item);
  const result = String(settlement.result || item.settlement_result || item.result || "").trim();
  const pieces = [];

  if (statusLabel) {
    pieces.push(statusLabel);
  }
  if (actual !== "—" && actual !== "-") {
    pieces.push(`Actual ${actual}`);
  }
  if (result) {
    pieces.push(result.charAt(0).toUpperCase() + result.slice(1));
  }

  return pieces.length ? pieces.join(" · ") : "—";
}

function displayGameStatus(item) {
  return String(
    item.status_display ||
    item.status_context ||
    item.game_state?.detailed ||
    item.game_state?.abstract ||
    item.outcome_state ||
    "—"
  ).trim() || "—";
}

function renderPropFacts(item, compact = false) {
  const style = compact
    ? "font-size:11px; opacity:.78; display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;"
    : "display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin-top:10px; font-size:12px; opacity:.88;";
  return `
    <div style="${style}">
      <div><strong>Name:</strong> ${displayTitle(item)}</div>
      <div><strong>Team:</strong> ${displayTeam(item)}</div>
      <div><strong>Matchup:</strong> ${displayMatchup(item)}</div>
      <div><strong>Game Status:</strong> ${displayGameStatus(item)}</div>
      <div><strong>Line:</strong> ${displayLine(item)}</div>
      <div><strong>Sport:</strong> ${String(item.sport || item.sport_slug || "—").trim() || "—"}</div>
      <div><strong>Odds:</strong> ${displayOdds(item)}</div>
      ${(displayLiveProjection(item) !== "—") ? `<div><strong>Live Projection:</strong> ${displayLiveProjection(item)}</div>` : ""}
      ${(displayMovementSummary(item) !== "—") ? `<div><strong>Movement:</strong> ${displayMovementSummary(item)}</div>` : ""}
      ${(displayActualValue(item) !== "—" || recommendationState(item) !== "pregame") ? `<div><strong>Actual:</strong> ${displayActualText(item)}</div>` : ""}
      ${(displaySettlementSummary(item) !== "—") ? `<div><strong>Settlement:</strong> ${displaySettlementSummary(item)}</div>` : ""}
      <div><strong>Actual Prop:</strong> ${displayActualProp(item)}</div>
    </div>
  `;
}

function renderRefreshStamp() {
  const refreshedAt = formatTimestamp(lastResponseTimestamp);
  return refreshedAt
    ? `<div style="font-size:11px; opacity:.62; margin-top:6px;">Refreshed ${refreshedAt}</div>`
    : "";
}

function edgeValue(item) {
  return numericValue(item.edge)
    ?? numericValue(item.adjusted_edge)
    ?? numericValue(item.expected_value)
    ?? numericValue(item.ev_current)
    ?? 0;
}

function edgeTheme(item) {
  const edge = edgeValue(item);
  if (edge > 0.06) {
    return {
      color: "#2ecc71",
      border: "rgba(46, 204, 113, .55)",
      background: "rgba(46, 204, 113, .10)",
      label: "HIGH EDGE",
    };
  }
  if (edge > 0.03) {
    return {
      color: "#f1c40f",
      border: "rgba(241, 196, 15, .55)",
      background: "rgba(241, 196, 15, .10)",
      label: "MEDIUM EDGE",
    };
  }
  return {
    color: "#7f8c8d",
    border: "rgba(127, 140, 141, .45)",
    background: "rgba(127, 140, 141, .10)",
    label: "LOW EDGE",
  };
}

function badgeStyle(kind) {
  const styles = {
    LIVE: { background: "rgba(59, 130, 246, .16)", color: "#d7e9ff", border: "rgba(59, 130, 246, .38)" },
    PREGAME: { background: "rgba(168, 85, 247, .16)", color: "#efe0ff", border: "rgba(168, 85, 247, .38)" },
    "HIGH CONFIDENCE": { background: "rgba(46, 204, 113, .16)", color: "#d6ffe4", border: "rgba(46, 204, 113, .38)" },
    "HIGH VARIANCE": { background: "rgba(231, 76, 60, .16)", color: "#ffd9d5", border: "rgba(231, 76, 60, .38)" },
    default: { background: "rgba(255,255,255,.08)", color: "#f3f4f6", border: "rgba(255,255,255,.16)" },
  };
  return styles[kind] || styles.default;
}

function renderBadge(label) {
  const style = badgeStyle(label);
  return `
    <span style="display:inline-flex; align-items:center; padding:4px 8px; border-radius:999px; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; background:${style.background}; color:${style.color}; border:1px solid ${style.border};">
      ${label}
    </span>
  `;
}

function renderCardBadges(item) {
  const badges = [];
  const state = recommendationState(item);
  const sportState = state === "live" ? "LIVE" : (state === "pregame" ? "PREGAME" : null);
  if (sportState) {
    badges.push(renderBadge(sportState));
  }

  const confidence = numericValue(item.confidence);
  if (confidence !== null && confidence >= 0.7) {
    badges.push(renderBadge("HIGH CONFIDENCE"));
  }

  const variance = numericValue(item.volatility) ?? numericValue(item.volatility_score);
  if (variance !== null && variance >= 0.67) {
    badges.push(renderBadge("HIGH VARIANCE"));
  }

  const theme = edgeTheme(item);
  badges.push(`
    <span style="display:inline-flex; align-items:center; padding:4px 8px; border-radius:999px; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; background:${theme.background}; color:${theme.color}; border:1px solid ${theme.border};">
      ${theme.label}
    </span>
  `);

  return `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">${badges.join("")}</div>`;
}

function normalizeIntelligenceResponse(response) {
  const analysis = response && typeof response.analysis === "object" && response.analysis ? response.analysis : (response && typeof response.response === "object" && response.response ? response.response : {});
  const recommendations = Array.isArray(response.recommendations) && response.recommendations.length
    ? response.recommendations
    : (Array.isArray(analysis.recommendations) ? analysis.recommendations : (Array.isArray(analysis.picks) ? analysis.picks : []));
  const topOpportunities = Array.isArray(response.top_opportunities) && response.top_opportunities.length
    ? response.top_opportunities
    : (Array.isArray(analysis.top_opportunities) ? analysis.top_opportunities : recommendations);
  const topLiveOpportunities = Array.isArray(response.top_live_opportunities) && response.top_live_opportunities.length
    ? response.top_live_opportunities
    : (Array.isArray(analysis.top_live_opportunities) ? analysis.top_live_opportunities : recommendations.filter((item) => String(item.tag || item.timing || item.phase || "").trim().toUpperCase() === "LIVE"));
  const portfolio = response.portfolio && typeof response.portfolio === "object"
    ? response.portfolio
    : (analysis.portfolio && typeof analysis.portfolio === "object" ? analysis.portfolio : {});
  const parlays = Array.isArray(response.parlays) && response.parlays.length
    ? response.parlays
    : (Array.isArray(analysis.parlays) ? analysis.parlays : []);

  return {
    analysis,
    recommendations,
    topOpportunities,
    topLiveOpportunities,
    portfolio,
    parlays,
  };
}

function hasLiveSignal(item) {
  if (!item || typeof item !== "object") {
    return false;
  }
  const liveProjection = String(item.live_projection ?? "").trim();
  return Boolean(
    item.hero_live_box ||
    item.hero_sim_box ||
    (liveProjection && liveProjection !== "-") ||
    (item.live_total !== null && item.live_total !== undefined)
  );
}

function recommendationState(item) {
  if (!item || typeof item !== "object") {
    return "unknown";
  }
  const status = String(item.status_display || item.status_context || item.game_state?.detailed || item.game_state?.abstract || "").trim().toLowerCase();
  const liveFlag = typeof item.is_live === "boolean" ? item.is_live : null;

  if (status.includes("final") || status.includes("completed")) {
    return "final";
  }
  if (status.includes("warmup") || status.includes("scheduled") || status.includes("pregame")) {
    return "pregame";
  }
  if ((status.includes("live") || status.includes("in progress")) && liveFlag && hasLiveSignal(item)) {
    return "live";
  }
  if (liveFlag && hasLiveSignal(item)) {
    return "live";
  }
  if (status.includes("live") || status.includes("in progress")) {
    return "stale";
  }
  return "pregame";
}

function isLiveRecommendation(item) {
  return recommendationState(item) === "live";
}

function isPregameRecommendation(item) {
  return recommendationState(item) === "pregame";
}

function renderLoadingState() {

function renderEmptyState() {
  const portfolioEl = document.getElementById("portfolio");
  const topOpportunitiesEl = document.getElementById("top-opportunities");
  const scannerEl = document.getElementById("scanner");
  const picksEl = document.getElementById("picks");
  const parlaysEl = document.getElementById("parlays");

  if (portfolioEl) {
    portfolioEl.innerHTML = `
      <div style="background:#111;color:white;padding:16px;border-radius:12px;">
        <div style="font-size:13px; opacity:.7;">Portfolio Overview</div>
        <div style="margin-top:10px; opacity:.8;">No opportunities available</div>
      </div>
    `;
  }

  if (topOpportunitiesEl) {
    topOpportunitiesEl.innerHTML = `
      <div style="background:#101010;color:white;padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,.08);">
        <h3 style="margin:0 0 8px 0;">Top Opportunities Right Now</h3>
        <div style="opacity:.65;">No opportunities available</div>
      </div>
    `;
  }

  if (scannerEl) {
    scannerEl.innerHTML = `
      <div style="background:#141414;color:white;padding:16px;border-radius:12px;">
        <div style="opacity:.65;">No opportunities available</div>
      </div>
    `;
  }

  if (picksEl) {
    picksEl.innerHTML = `
      <div style="background:#1a1a1a;color:white;padding:16px;border-radius:12px;">
        <div style="opacity:.65;">No opportunities available</div>
      </div>
    `;
  }

  if (parlaysEl) {

function kickOffWarmQuery() {
  if (warmKickoffInFlight) {
    return;
  }
  warmKickoffInFlight = true;
  setRefreshStatus("Refreshing odds/opportunities…", "refreshing");
  void fetch("/intelligence/run", {
    method: "GET",
  }).catch(() => {}).finally(() => {
    warmKickoffInFlight = false;
  });
}

async function loadIntelligence(options = {}) {
  const background = Boolean(options.background);
  if (currentIntelligenceRequest) {
    return currentIntelligenceRequest;
  }

  if (background && !hasRenderedIntelligence) {
    return null;
  }

  if (background) {
    setRefreshStatus("Refreshing intelligence…", "refreshing");
  }

  currentIntelligenceRequest = (async () => {
  try {
    if (!hasRenderedIntelligence && lastVersion === null) {
      renderLoadingState();
      kickOffWarmQuery();
    }
    const res = await fetch("/api/intelligence/query", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ question: "top edges today", force_refresh: true, background })
    });

    if (!res.ok) {
      if (!hasRenderedIntelligence) {
        renderErrorState("Failed to load data");
      } else {
        setRefreshStatus("Refresh failed", "error");
      }
      return;
    }

    const json = await res.json();
    const version = json.version ?? null;

    if (version !== null && version === lastVersion) {
      if (background) {
        setRefreshStatus(lastResponseTimestamp ? `Updated ${formatTimestamp(lastResponseTimestamp)}` : "Up to date", "idle");
      }
      return;
    }

    lastVersion = version;
    lastResponseTimestamp = json.timestamp ?? lastResponseTimestamp;

    const response = json.response || {};
    const data = normalizeIntelligenceResponse(response);
    const hasOpportunityData = Boolean(
      (Array.isArray(data.topOpportunities) && data.topOpportunities.length) ||
      (Array.isArray(data.recommendations) && data.recommendations.length) ||
      (Array.isArray(data.parlays) && data.parlays.length) ||
      (data.portfolio && Object.keys(data.portfolio).length)
    );

    if (!response || Object.keys(response).length === 0 || !hasOpportunityData) {
      if (!hasRenderedIntelligence) {
        renderEmptyState();
      } else {
        setRefreshStatus("No new intelligence yet", "idle");
      }
      kickOffWarmQuery();
      return;
    }

    renderIntelligence(response);
  } catch (err) {
    if (!hasRenderedIntelligence) {
      renderErrorState("Failed to load data");
    } else {
      setRefreshStatus("Refresh failed", "error");
    }
  } finally {
    currentIntelligenceRequest = null;
  }
  })();

  return currentIntelligenceRequest;
}

function scheduleIntelligencePolling() {
  if (loadIntelligenceScheduled) {
    return;
  }
  loadIntelligenceScheduled = true;
  window.loadIntelligence = loadIntelligence;
  void loadIntelligence({ background: false });
  window.setInterval(() => {
    kickOffWarmQuery();
    void loadIntelligence({ background: true });
  }, 30000);
  document.addEventListener("DOMContentLoaded", () => {
    void loadIntelligence({ background: false });
  });
  window.addEventListener("focus", () => {
    void loadIntelligence({ background: true });
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      void loadIntelligence({ background: true });
    }
  });
}

scheduleIntelligencePolling();
</script>
