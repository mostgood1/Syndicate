{% extends "shared/base.html" %}

{% block title %}Syndicate | Market Board — Book Grid{% endblock %}
{% block page_title %}Market Board — Book Grid{% endblock %}

{% block extra_head %}
<style>
  /* L1-A. Dense by design: the point is to see every book at once, so the grid
     is scrolled horizontally inside its own container rather than wrapped. */
  .bg-wrap { padding: 0 12px 40px; }
  .bg-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
  .bg-controls select, .bg-controls input {
    background: #131a24; color: #e8eef7; border: 1px solid #26313f;
    border-radius: 6px; padding: 6px 9px; font-size: 13px;
  }
  .bg-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
  .bg-tab {
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12px;
    background: #141b25; color: #9fb0c6; border: 1px solid #26313f; white-space: nowrap;
  }
  .bg-tab--on { background: #1d4ed8; color: #fff; border-color: #2563eb; }

  .bg-summary { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: #9fb0c6; margin-bottom: 10px; }
  .bg-summary b { color: #e8eef7; }
  .bg-warn { color: #f0b429; }

  .bg-scroll { overflow-x: auto; border: 1px solid #1e2733; border-radius: 8px; }
  table.bg { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.bg th, table.bg td { padding: 5px 8px; border-bottom: 1px solid #1a2230; text-align: right; white-space: nowrap; }
  table.bg th { position: sticky; top: 0; background: #0f151d; color: #8fa2b8; font-weight: 600; z-index: 2; }
  table.bg td.bg-mkt, table.bg th.bg-mkt { text-align: left; position: sticky; left: 0; background: #0f151d; z-index: 1; }
  table.bg tr:hover td { background: #121a24; }

  .bg-side { color: #8fa2b8; font-size: 11px; }
  .bg-price { font-variant-numeric: tabular-nums; }
  .bg-best { color: #34d399; font-weight: 700; }
  /* Greyed WITH A REASON -- never hidden. The reason is served by the API. */
  .bg-stale { color: #5b6675; text-decoration: underline dotted; cursor: help; }
  .bg-missing { color: #2b3543; }
  .bg-gap { color: #f0b429; font-size: 11px; cursor: help; }
  .bg-meta { color: #7d8ea4; font-size: 11px; }
  /* The three selectors read top-down as the choice narrows: kind, then market,
     then segment. Spacing carries that hierarchy without extra chrome. */
  .bg-kinds { margin-bottom: 2px; }
  .bg-segments { margin-top: 2px; margin-bottom: 2px; }
  /* Segment identity -- a game is quoted once per segment, so several rows share
     one fixture legitimately. Badged, not inferred from row order. */
  .bg-seg {
    color: #9cc0e6; background: #16222f; border: 1px solid #24384d;
    border-radius: 3px; padding: 0 4px; font-size: 10px; font-weight: 600;
    cursor: help; white-space: nowrap;
  }
  /* A settled segment is VOID, not stale -- a different failure from a late
     price, so it gets a different colour and never the stale treatment. */
  .bg-void {
    color: #0b0f14; background: #f0b429; border-radius: 3px;
    padding: 0 4px; font-size: 10px; font-weight: 700;
    cursor: help; white-space: nowrap;
  }
  .bg-live { color: #34d399; font-size: 11px; font-weight: 600; }
  /* Modelled, not measured. Distinct colour + a trailing asterisk so it can
     never be mistaken for a two-sided no-vig consensus. */
  .bg-modelled { color: #a78bfa; font-style: italic; cursor: help; }
  th.bg-sortable { cursor: pointer; user-select: none; }
  th.bg-sortable:hover { color: #e8eef7; }
  .bg-empty { padding: 30px; text-align: center; color: #7d8ea4; }
</style>
{% endblock %}

{% block content %}
<div class="bg-wrap">
  <div class="bg-controls">
    <label class="bg-meta">Sport
      <select id="bg-sport">
        {% for slug in sports %}<option value="{{ slug }}"{% if slug == sport %} selected{% endif %}>{{ slug|upper }}</option>{% endfor %}
      </select>
    </label>
    <label class="bg-meta">Date <input type="date" id="bg-date" value="{{ selected_date }}" /></label>
    <button class="bg-tab" id="bg-refresh">Refresh</button>
    <a class="bg-tab" href="/market-board">&larr; Market Board</a>
    <span class="bg-meta" id="bg-status">loading…</span>
  </div>

  <!-- Kind first, then markets. The market tabs are a function of this
       selection, so it reads left-to-right in the order the choice is made. -->
  <div class="bg-tabs bg-kinds" id="bg-kind-tabs"></div>
  <div class="bg-tabs" id="bg-market-tabs"></div>
  <!-- Segment groups: full game / first 5 / first 3 / first 1 are separate
       boards, not variants of one row. -->
  <div class="bg-tabs bg-segments" id="bg-segment-tabs"></div>
  <div class="bg-summary" id="bg-summary"></div>
  <div class="bg-scroll"><table class="bg"><thead id="bg-head"></thead><tbody id="bg-body"></tbody></table></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
  // Game lines first: they carry the widest book coverage (11 of 11 on MLB),
  // so the grid opens on the markets that actually look like a grid. Props are
  // thinner and are one tab away.
  var GAME_LINES = ["h2h", "spreads", "totals"];

  // Kind is the FIRST filter, mirroring Layer 2: choose game or prop, and the
  // market tabs become that kind's markets. Which market is which kind is served
  // by the API as `market_kinds` -- it is derived from the same `kind` the rows
  // carry, and is deliberately not re-derived here from market names (#244: one
  // rule, one place).
  var KINDS = [
    { key: "game", label: "Game lines" },
    { key: "prop", label: "Player props" }
  ];
  var state = {
    kind: "game",
    segment: "full",
    market: "h2h",
    markets: [],
    marketKinds: {},
    rows: [],
    summary: {},
    sort: { key: null, dir: 1 }
  };

  // Markets belonging to the selected kind. A market whose kind the API did not
  // report is shown under every kind rather than hidden -- an unclassified
  // market is a capture question, and silently dropping it from the board is how
  // it stays invisible.
  function marketsForKind(kind) {
    return state.markets.filter(function (m) {
      var k = state.marketKinds[m];
      return !k || k === kind;
    });
  }

  function kindsPresent() {
    return KINDS.filter(function (k) { return marketsForKind(k.key).length > 0; });
  }

  function el(id) { return document.getElementById(id); }
  function fmtPrice(p) { return p === null || p === undefined ? "" : (p > 0 ? "+" + p : String(p)); }

  // Segment identity. A game is quoted once per segment, so the same fixture
  // legitimately occupies several rows; without a visible segment they read as
  // duplicates. `full` is badged too rather than left blank -- an unlabelled row
  // among labelled ones invites the reader to guess, and the whole point here is
  // that the reader should not have to.
  var SEGMENTS = {
    full:   { short: "Full", title: "full game" },
    first5: { short: "F5",   title: "first 5 innings", innings: 5 },
    first3: { short: "F3",   title: "first 3 innings", innings: 3 },
    first1: { short: "F1",   title: "first inning",    innings: 1 }
  };

  // Longest market first (full > F5 > F3 > F1), so a game's segments sort into a
  // stable, meaningful block. Zero-padded because this is concatenated into a
  // string sort key, where "10" would otherwise precede "2".
  var SEGMENT_ORDER = { full: 0, first5: 1, first3: 2, first1: 3 };
  function segmentRank(segment) {
    var rank = SEGMENT_ORDER[String(segment)];
    return rank === undefined ? "9" : String(rank);
  }

  function segmentBadge(segment) {
    if (segment === null || segment === undefined || segment === "") return "";
    var key = String(segment);
    var meta = SEGMENTS[key];
    // An unrecognised segment is shown verbatim rather than hidden or coerced to
    // "Full" -- a segment we cannot name is exactly the case worth seeing.
    var short = meta ? meta.short : key;
    var title = meta ? meta.title : "segment: " + key;
    return ' <span class="bg-seg" title="' + title.replace(/"/g, "&quot;") + '">' + short + "</span>";
  }

  // Live-state validity. A first-5 line is not "stale" once the 5th is over --
  // it is VOID, and a void price sitting beside a live full-game price is the
  // dangerous case the plan's C4 calls out. Returns a reason string when the
  // segment can no longer be bet, otherwise null.
  //
  // There is no `inning` field on the game object; the inning is only available
  // inside `status_token`, which is "TOP 7" / "BOT 4" for a live MLB game
  // (asserted in tests/test_game_chip_scoreboard.py). Parsed rather than assumed,
  // and anything unparseable yields null -- no claim is better than a wrong one.
  function segmentInningsElapsed(game) {
    if (!game || game.state !== "live") return null;
    var m = /(?:TOP|BOT|MID|END)\s*(\d+)/i.exec(String(game.status_token || ""));
    return m ? Number(m[1]) : null;
  }

  function segmentDeadReason(segment, game) {
    var meta = SEGMENTS[String(segment)];
    if (!meta || !meta.innings) return null;
    var inning = segmentInningsElapsed(game);
    if (inning === null) return null;
    // Strictly greater: "BOT 5" is still inside the first 5, "TOP 6" is not.
    if (inning > meta.innings) {
      return meta.title + " is over — this market is settled, not live";
    }
    return null;
  }

  function load(market) {
    var sport = el("bg-sport").value;
    var date = el("bg-date").value;
    el("bg-status").textContent = "loading…";
    // Fetch PER MARKET, not a global top-N. The grid is ranked by book
    // coverage, so a global limit returns the widest markets and silently drops
    // the thin ones -- which are precisely the one-sided rows the margin model
    // exists to fill. batter_home_runs (100% `over`, 355 rows) was unreachable
    // in the UI entirely.
    var q = "/api/board/book-grid?sport=" + encodeURIComponent(sport) +
            "&date=" + encodeURIComponent(date) + "&limit=600";
    if (market) { q += "&market=" + encodeURIComponent(market); }
    fetch(q)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        state.rows = d.rows || [];
        // Same reasoning as `markets` below, and renderSummary depends on it:
        // coverage describes the SLATE, not the tab you are looking at. A
        // per-market response summarises only that market, so keep the figures
        // from the unfiltered load instead of letting each tab overwrite them.
        if (!market || !Object.keys(state.summary || {}).length) { state.summary = d.summary || {}; }
        // `markets` is filtered to the requested market when one is passed, so
        // keep the full list from the unfiltered load rather than collapsing
        // the tab bar to the tab you just clicked.
        if (!market || !state.markets.length) { state.markets = d.markets || []; }
        // Same preservation rule: `market_kinds` is computed before the market
        // filter server-side, but only the unfiltered load is guaranteed to have
        // been asked about the whole slate.
        if (!market || !Object.keys(state.marketKinds || {}).length) { state.marketKinds = d.market_kinds || {}; }
        // Fall back to a kind that actually has markets before choosing one.
        if (!marketsForKind(state.kind).length) {
          var firstKind = kindsPresent()[0];
          if (firstKind) { state.kind = firstKind.key; }
        }
        var withinKind = marketsForKind(state.kind);
        if (withinKind.indexOf(state.market) === -1) {
          // Prefer a game line, then whatever exists WITHIN THE SELECTED KIND --
          // otherwise picking "props" would land on h2h and silently flip the
          // selector back.
          var pick = GAME_LINES.filter(function (m) { return withinKind.indexOf(m) !== -1; })[0];
          state.market = pick || withinKind[0] || "";
        }
        el("bg-status").textContent = d.total_rows + " markets · " + (d.summary || {}).distinct_books + " books";
        renderKindTabs(); renderTabs(); renderSummary();
        // The UNFILTERED load exists only to discover the market list and the
        // slate summary. It is exactly the global top-N the comment above warns
        // about, so rendering it drops the thin rows of whichever tab we land on:
        // measured 2026-08-07, the h2h tab showed 44 of its 60 rows and the
        // one-book `first1` segment was missing from the board entirely. The
        // per-market refetch was wired to tab clicks and never to first paint.
        // Re-entry is safe: this call passes a market, so it cannot recurse.
        if (!market && state.market) { load(state.market); return; }
        syncSegment();
        renderSegmentTabs();
        renderGrid();
      })
      .catch(function (err) { el("bg-status").textContent = "failed: " + err; });
  }

  // Segments present in the rows we actually hold, in longest-market-first order.
  // Derived from the loaded rows rather than assumed, because which segments a
  // market is quoted on varies: MLB game lines carry full/first5/first3/first1
  // while a player prop is typically full only.
  function segmentsInRows() {
    var seen = {};
    state.rows.forEach(function (r) {
      if (r.market !== state.market) { return; }
      var s = (r.segment === null || r.segment === undefined || r.segment === "") ? "full" : String(r.segment);
      seen[s] = true;
    });
    return Object.keys(seen).sort(function (a, b) {
      return segmentRank(a).localeCompare(segmentRank(b)) || a.localeCompare(b);
    });
  }

  // Keep the selected segment valid across a market change. Falls back to the
  // longest segment available rather than to none, so switching markets never
  // lands on an empty board.
  function syncSegment() {
    var avail = segmentsInRows();
    if (avail.indexOf(state.segment) === -1) { state.segment = avail[0] || "full"; }
  }

  function renderKindTabs() {
    var present = kindsPresent();
    // One kind is not a choice. Hiding the row beats showing a control that
    // cannot do anything.
    if (present.length < 2) { el("bg-kind-tabs").innerHTML = ""; return; }
    el("bg-kind-tabs").innerHTML = present.map(function (k) {
      return '<span class="bg-tab' + (k.key === state.kind ? " bg-tab--on" : "") +
             '" data-k="' + k.key + '">' + k.label + " <span class=\"bg-meta\">" +
             marketsForKind(k.key).length + "</span></span>";
    }).join("");
    Array.prototype.forEach.call(el("bg-kind-tabs").children, function (node) {
      node.onclick = function () {
        state.kind = node.getAttribute("data-k");
        var within = marketsForKind(state.kind);
        if (within.indexOf(state.market) === -1) {
          var pick = GAME_LINES.filter(function (m) { return within.indexOf(m) !== -1; })[0];
          state.market = pick || within[0] || "";
        }
        renderKindTabs(); renderTabs();
        load(state.market);
      };
    });
  }

  // Segment is a BOARD GROUP, not a row attribute: full game, first 5, first 3
  // and first 1 are separate markets with separate prices and separate book
  // coverage (11 / 9 / 5 / 1 books on a sampled MLB game), and mixing them in one
  // table is what made a game look like it was listed four times.
  function renderSegmentTabs() {
    var avail = segmentsInRows();
    if (avail.length < 2) { el("bg-segment-tabs").innerHTML = ""; return; }
    el("bg-segment-tabs").innerHTML = avail.map(function (s) {
      var meta = SEGMENTS[s];
      var label = meta ? meta.short : s;
      var title = meta ? meta.title : "segment: " + s;
      return '<span class="bg-tab' + (s === state.segment ? " bg-tab--on" : "") +
             '" data-s="' + s + '" title="' + title.replace(/"/g, "&quot;") + '">' + label + "</span>";
    }).join("");
    Array.prototype.forEach.call(el("bg-segment-tabs").children, function (node) {
      node.onclick = function () {
        state.segment = node.getAttribute("data-s");
        renderSegmentTabs(); renderGrid();   // same rows, different group -- no refetch
      };
    });
  }

  function renderTabs() {
    var within = marketsForKind(state.kind);
    var ordered = GAME_LINES.filter(function (m) { return within.indexOf(m) !== -1; })
      .concat(within.filter(function (m) { return GAME_LINES.indexOf(m) === -1; }));
    el("bg-market-tabs").innerHTML = ordered.map(function (m) {
      return '<span class="bg-tab' + (m === state.market ? " bg-tab--on" : "") + '" data-m="' + m + '">' + m + "</span>";
    }).join("");
    Array.prototype.forEach.call(el("bg-market-tabs").children, function (node) {
      node.onclick = function () {
        state.market = node.getAttribute("data-m");
        renderTabs();
        load(state.market);   // refetch: this market's own top-N, not a slice
      };
    });
  }

  function renderSummary() {
    var s = state.summary || {};
    // Coverage describes the SLATE, not the current tab -- the API summarises
    // before filtering, deliberately.
    el("bg-summary").innerHTML =
      "<span><b>" + (s.rows || 0) + "</b> markets</span>" +
      "<span><b>" + (s.distinct_books || 0) + "</b> books</span>" +
      "<span><b>" + (s.pct_3plus_books || 0) + "%</b> with 3+ books</span>" +
      "<span><b>" + (s.pct_two_sided || 0) + "%</b> two-sided</span>" +
      '<span class="bg-warn">' + (s.rows_single_book || 0) + " single-book · " +
        (s.rows_with_suspect_best || 0) + " stale best</span>" +
      '<span class="bg-meta">coverage is for the whole slate, not this tab</span>';
  }

  // Sort key per row. Nulls always sort LAST regardless of direction -- a blank
  // is "we don't know", and letting it rank above a real value in one direction
  // would put unknowns at the top of a board people read top-down.
  function sortValue(r, key) {
    var p = r.projection || {};
    var g = r.game || {};
    var side = p.side || (r.sides || [])[0];
    var best = (r.best || {})[side] || {};
    switch (key) {
      // Segment is part of the sort key, not decoration: without it the four
      // segments of one game sort as equal and interleave with other games,
      // which is what made them look like duplicates in the first place.
      case "mkt": return (r.player_name || (r.away_team || "") + " @ " + (r.home_team || "")) + " " + (r.line === null ? "" : r.line) + " " + segmentRank(r.segment);
      case "date": return g.start_time_utc || "";
      case "game": return (g.state === "live" ? "0" : g.state === "pregame" ? "1" : "2") + (g.start_time_utc || "");
      case "proj": return p.projected === undefined || p.projected === null ? null : p.projected;
      case "edge": return p.edge_vs_market_pct === undefined || p.edge_vs_market_pct === null ? null : p.edge_vs_market_pct;
      case "best": return best.price === undefined || best.price === null ? null : best.price;
      case "fair": return ((r.modelled_fair || {})[side] || {}).fair_price || (p.market_fair_prob_over || null);
      case "cons": return (r.consensus || {})[side];
      case "age": return r.age_seconds === null || r.age_seconds === undefined ? null : r.age_seconds;
      default: return null;
    }
  }

  function renderGrid() {
    // Market AND segment: a segment is its own board group, so full-game and
    // first-5 prices never share a table even though they share a market name.
    var rows = state.rows.filter(function (r) {
      if (r.market !== state.market) { return false; }
      var seg = (r.segment === null || r.segment === undefined || r.segment === "") ? "full" : String(r.segment);
      return seg === state.segment;
    });
    if (state.sort.key) {
      var k = state.sort.key, dir = state.sort.dir;
      rows = rows.slice().sort(function (a, b) {
        var av = sortValue(a, k), bv = sortValue(b, k);
        var an = (av === null || av === undefined), bn = (bv === null || bv === undefined);
        if (an && bn) return 0;
        if (an) return 1;      // nulls last, both directions
        if (bn) return -1;
        if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
        return String(av).localeCompare(String(bv)) * dir;
      });
    }
    if (!rows.length) {
      el("bg-head").innerHTML = "";
      el("bg-body").innerHTML = '<tr><td class="bg-empty">No captured markets for this selection.</td></tr>';
      return;
    }
    // Column set = every book seen in this tab, so the grid does not carry
    // empty columns for books that never quote this market.
    var books = [];
    rows.forEach(function (r) { (r.books || []).forEach(function (b) { if (books.indexOf(b) === -1) books.push(b); }); });
    books.sort();

    // Sortable: every column that means something to sort by carries a key.
    // Book columns are deliberately NOT sortable -- sorting a grid by one
    // book's price reorders rows by a number most of them do not have, which
    // looks like a ranking and is not one.
    var SORTABLE = [
      ["mkt", "Market"], ["date", "Date"], ["game", "Game"], [null, "Side"],
      ["proj", "Proj"], ["edge", "Edge"], ["best", "Best"], ["fair", "Fair"], ["cons", "Consensus"],
    ];
    el("bg-head").innerHTML = "<tr>" + SORTABLE.map(function (col, i) {
      var key = col[0], label = col[1];
      var cls = (i === 0 ? "bg-mkt" : "");
      if (!key) { return "<th class='" + cls + "'>" + label + "</th>"; }
      var arrow = state.sort.key === key ? (state.sort.dir > 0 ? " ▲" : " ▼") : "";
      return "<th class='" + cls + " bg-sortable' data-sort='" + key + "'>" + label + arrow + "</th>";
    }).join("") +
      books.map(function (b) { return "<th>" + b + "</th>"; }).join("") +
      "<th class='bg-sortable' data-sort='age'>Updated" +
      (state.sort.key === "age" ? (state.sort.dir > 0 ? " ▲" : " ▼") : "") + "</th></tr>";
    Array.prototype.forEach.call(el("bg-head").querySelectorAll("[data-sort]"), function (th) {
      th.onclick = function () {
        var key = th.getAttribute("data-sort");
        if (state.sort.key === key) { state.sort.dir = -state.sort.dir; }
        else { state.sort.key = key; state.sort.dir = 1; }
        renderGrid();
      };
    });

    var html = [];
    rows.forEach(function (r) {
      var label = (r.player_name ? r.player_name : (r.away_team || "") + " @ " + (r.home_team || ""));
      var lineTxt = (r.line === null || r.line === undefined) ? "" : " " + r.line;
      // A game appears once PER SEGMENT -- full, first5, first3, first1 are four
      // different markets with different prices and different book counts (11 / 9
      // / 5 / 1 on a sampled game). Without this badge they render as four
      // identical game labels and read as duplicate rows, which is what a user
      // reported. The segment is part of the row's identity, so it is shown on
      // every row including "Full", never left to be inferred from position.
      var segTxt = segmentBadge(r.segment);
      var segDead = segmentDeadReason(r.segment, r.game);
      var segDeadTxt = segDead
        ? ' <span class="bg-void" title="' + segDead.replace(/"/g, "&quot;") + '">VOID</span>'
        : "";
      (r.sides || []).forEach(function (side, idx) {
        var best = (r.best || {})[side] || {};
        var cells = books.map(function (b) {
          var cell = ((r.cells || {})[b] || {})[side];
          if (!cell || cell.price === null || cell.price === undefined) {
            return '<td class="bg-missing">·</td>';
          }
          var cls = "bg-price";
          var title = b + " · " + (cell.observed_at || "");
          if (cell.stale) { cls += " bg-stale"; title = cell.reason || title; }
          else if (best.bookmaker === b) { cls += " bg-best"; }
          return '<td class="' + cls + '" title="' + title.replace(/"/g, "&quot;") + '">' + fmtPrice(cell.price) + "</td>";
        }).join("");

        var gapMark = "";
        if (idx === 0 && r.gaps && r.gaps.length) {
          gapMark = ' <span class="bg-gap" title="' + r.gaps.join(" · ").replace(/"/g, "&quot;") + '">&#9888;</span>';
        }
        // Projection first: `bestTxt` below reads it to decide which side the
        // model favours. (Defining it after was a `var` hoisting trap -- `proj`
        // existed but was undefined, so every row threw.)
        var proj = r.projection || {};
        // Render Proj/Edge against the side the projection actually DESCRIBES,
        // not the first row. A prop's model_prob is the over; a game market's
        // is home. Showing home's edge on the away row is a number that is
        // right and labelled wrong, which reads as a real signal.
        var projSide = proj.side || (r.sides || [])[0];
        var onProjSide = (side === projSide);

        // BEST highlights the side the SIM leans on, not merely the best number.
        // The green cell answers "which side does our model like", which is the
        // question the board exists for; a bare best price answers "where is the
        // biggest number", which is true of both sides at once and tells you
        // nothing. Falls back to plain formatting when there is no projection,
        // so a row without a model view never implies one.
        var simSide = null;
        if (proj.edge_vs_market_pct !== undefined && proj.edge_vs_market_pct !== null) {
          // A positive edge favours the projected side; a negative one favours
          // its opposite, which is a real signal rather than the absence of one.
          var other = (r.sides || []).filter(function (s) { return s !== projSide; })[0];
          simSide = proj.edge_vs_market_pct > 0 ? projSide : other;
        }
        var bestTxt = fmtPrice(best.price);
        if (best.suspect_stale) {
          bestTxt = '<span class="bg-stale" title="' + String(r.gaps.join(" · ")).replace(/"/g, "&quot;") + '">' + bestTxt + "</span>";
        } else if (best.price !== undefined && best.price !== null) {
          if (simSide !== null && side === simSide) {
            bestTxt = '<span class="bg-best" title="the model favours this side (edge ' +
              (proj.edge_vs_market_pct > 0 ? "+" : "") + proj.edge_vs_market_pct.toFixed(1) +
              ' pts on ' + projSide + ')">' + bestTxt + " ◄</span>";
          } else if (simSide !== null) {
            bestTxt = '<span class="bg-meta" title="the model does not favour this side">' + bestTxt + "</span>";
          } else {
            bestTxt = '<span class="bg-price">' + bestTxt + "</span>";
          }
        }

        // Projection + edge: the differentiator, and the reason a blank cell is
        // never a dash without a cause. Edge is signed against the NO-VIG
        // market probability, so the sign means what it looks like it means.
        // For a GAME market the projection is a win/cover probability, not a
        // projected stat -- "0.495" alone is unreadable. Name the team it
        // refers to instead, which is the thing a reader is actually asking.
        var projTxt = "";
        if (onProjSide) {
          var isGame = (proj.source === "game_simulation");
          if (isGame && proj.model_prob_over !== null && proj.model_prob_over !== undefined) {
            var teamName = (String(projSide).toLowerCase() === "home") ? r.home_team
                         : (String(projSide).toLowerCase() === "away") ? r.away_team
                         : String(projSide);
            projTxt = '<span title="' + String(proj.basis || "") + '">' + String(teamName || projSide) +
              " " + (proj.model_prob_over * 100).toFixed(1) + "%</span>";
          } else if (proj.projected !== undefined && proj.projected !== null) {
            projTxt = '<span title="' + String(proj.source || "").replace(/"/g, "&quot;") + " / " + String(proj.basis || "") + '">' + proj.projected + "</span>";
          } else {
            projTxt = '<span class="bg-missing">·</span>';
          }
        }
        var edgeTxt = "";
        if (onProjSide) {
          if (proj.edge_vs_market_pct === undefined || proj.edge_vs_market_pct === null) {
            edgeTxt = '<span class="bg-missing" title="no two-sided market, so no-vig fair value cannot be computed">·</span>';
          } else {
            var e = proj.edge_vs_market_pct;
            edgeTxt = '<span class="' + (e > 0 ? "bg-best" : "bg-meta") + '" title="model ' +
              (proj.model_prob_over !== null ? (proj.model_prob_over * 100).toFixed(1) + "%" : "?") +
              " vs no-vig market " + (proj.market_fair_prob_over !== null ? (proj.market_fair_prob_over * 100).toFixed(1) + "%" : "?") +
              '">' + (e > 0 ? "+" : "") + e.toFixed(1) + "</span>";
          }
        }

        // Game context. A 40-minute-old price six hours before first pitch is
        // normal; the same age in the 7th is a dead line. Without this the
        // Updated column cannot be read.
        var g = r.game || {};
        // Date separate from time: a board that spans a slate boundary (and the
        // forward-looking scope in the plan spans a week) is unreadable when
        // "7:05" could be tonight or Thursday.
        var dateTxt = "";
        if (idx === 0) {
          if (g.start_time_utc) {
            var dt = new Date(g.start_time_utc);
            dateTxt = '<span class="bg-meta">' +
              dt.toLocaleDateString([], { month: "short", day: "numeric" }) + "</span>";
          } else {
            dateTxt = '<span class="bg-missing">·</span>';
          }
        }
        var gameTxt = "";
        if (idx === 0) {
          if (g.state === "live") {
            gameTxt = '<span class="bg-live" title="' + String(g.matchup || "") + '">' + (g.status_token || "LIVE") +
              " " + (g.away_score || 0) + "-" + (g.home_score || 0) + "</span>";
          } else if (g.state === "final") {
            gameTxt = '<span class="bg-meta">FINAL</span>';
          } else if (g.start_time_utc) {
            var t = new Date(g.start_time_utc);
            gameTxt = '<span class="bg-meta" title="' + String(g.matchup || "") + '">' +
              t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + "</span>";
          } else {
            gameTxt = '<span class="bg-missing">·</span>';
          }
        }

        // Fair value. A MODELLED fair (one-sided market, derived from the
        // book's own measured margin) is rendered in a different colour with
        // its assumption in the tooltip -- it must never look like a measured
        // two-sided consensus. #242: a value wearing a measurement's clothes is
        // worse than a blank, because it looks authoritative.
        var fairTxt = '<span class="bg-missing">·</span>';
        var modelled = (r.modelled_fair || {})[side];
        if (modelled) {
          fairTxt = '<span class="bg-modelled" title="' +
            String(modelled.note || "").replace(/"/g, "&quot;") + '">' +
            fmtPrice(modelled.fair_price) + "*</span>";
        } else if (proj.market_fair_prob_over !== undefined && proj.market_fair_prob_over !== null &&
                   String(side).toLowerCase().match(/^(over|home|yes|1)$/)) {
          // Measured, two-sided: shown plainly.
          var fp = proj.market_fair_prob_over;
          var fairPrice = fp > 0.5 ? Math.round(-100 * fp / (1 - fp)) : Math.round(100 * (1 - fp) / fp);
          fairTxt = '<span class="bg-meta" title="two-sided no-vig consensus">' + fmtPrice(fairPrice) + "</span>";
        }

        var span = ' rowspan="' + r.sides.length + '"';
        html.push(
          "<tr>" +
          (idx === 0 ? '<td class="bg-mkt"' + span + ">" + label + lineTxt + segTxt + segDeadTxt + gapMark + "</td>" : "") +
          (idx === 0 ? "<td" + span + ">" + dateTxt + "</td>" : "") +
          (idx === 0 ? "<td" + span + ">" + gameTxt + "</td>" : "") +
          '<td class="bg-side">' + side + "</td>" +
          "<td>" + projTxt + "</td>" +
          "<td>" + edgeTxt + "</td>" +
          "<td>" + bestTxt + "</td>" +
          "<td>" + fairTxt + "</td>" +
          '<td class="bg-meta">' + fmtPrice((r.consensus || {})[side]) + "</td>" +
          cells +
          (idx === 0 ? '<td class="bg-meta"' + span + ">" + (r.age_seconds === null ? "?" : Math.round(r.age_seconds / 60) + "m") + "</td>" : "") +
          "</tr>"
        );
      });
    });
    el("bg-body").innerHTML = html.join("");
  }

  // A sport or date change invalidates the whole taxonomy, not just the rows:
  // clear the slate-scoped caches so they are re-derived rather than carried
  // over from the previous slate.
  function reload() { state.markets = []; state.marketKinds = {}; state.summary = {}; load(); }
  el("bg-refresh").onclick = reload;
  el("bg-sport").onchange = reload;
  el("bg-date").onchange = reload;
  load();
})();
</script>
{% endblock %}
